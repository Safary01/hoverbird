<!DOCTYPE html>
<html>
<head>
  <title>HoverBird Hall of Fame</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #87CEEB;
      text-align: center;
    }

    .top-bar {
      padding: 15px;
    }

    .top-btn {
      padding: 10px 16px;
      border: none;
      border-radius: 8px;
      background: white;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
    }

    h2 {
      margin: 10px;
    }

    .subtitle {
      margin-bottom: 20px;
      padding: 0 15px;
      font-size: 15px;
    }

    .container {
      max-width: 600px;
      margin: auto;
      padding: 10px;
    }

    .season-card {
      background: white;
      border-radius: 12px;
      padding: 15px;
      margin-bottom: 15px;
      text-align: left;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
    }

    .season-title {
      font-size: 20px;
      font-weight: bold;
      margin-bottom: 12px;
      text-align: center;
    }

    .winner {
      display: flex;
      justify-content: space-between;
      margin: 8px 0;
      font-size: 16px;
    }

    .gold {
      color: #d4af37;
      font-weight: bold;
    }

    .silver {
      color: #777;
      font-weight: bold;
    }

    .bronze {
      color: #b87333;
      font-weight: bold;
    }

    .loading {
      font-size: 18px;
      margin-top: 30px;
    }
  </style>
</head>

<body>

<div class="top-bar">
  <button class="top-btn" onclick="goLeaderboard()">
    ← Leaderboard
  </button>
</div>

<h2>🏆 HoverBird Hall of Fame</h2>

<div class="subtitle">
  Monthly champions and top performers.
</div>

<div id="hall" class="container">
  <div class="loading">Loading...</div>
</div>

<script type="module">

import { db } from "./js/firebase-config.js";

import {
  collection,
  getDocs
} from "https://www.gstatic.com/firebasejs/12.14.0/firebase-firestore.js";

const hall =
  document.getElementById("hall");

async function loadHallOfFame() {

  try {

    const snapshot =
      await getDocs(
        collection(db, "monthlyWinners")
      );

    let seasons = [];

    snapshot.forEach(doc => {

      seasons.push(doc.data());

    });

    seasons.sort((a, b) =>
      b.season.localeCompare(a.season)
    );

    hall.innerHTML = "";

    if (seasons.length === 0) {

      hall.innerHTML =
        "<p>No archived seasons yet.</p>";

      return;
    }

    seasons.forEach(season => {

      const card =
        document.createElement("div");

      card.className =
        "season-card";

      card.innerHTML = `
        <div class="season-title">
          ${season.season}
        </div>

        <div class="winner gold">
          <span>🥇 ${season.firstPlace || "-"}</span>
          <span>${season.firstScore || 0}</span>
        </div>

        <div class="winner silver">
          <span>🥈 ${season.secondPlace || "-"}</span>
          <span>${season.secondScore || 0}</span>
        </div>

        <div class="winner bronze">
          <span>🥉 ${season.thirdPlace || "-"}</span>
          <span>${season.thirdScore || 0}</span>
        </div>
      `;

      hall.appendChild(card);

    });

  } catch (error) {

    console.error(error);

    hall.innerHTML =
      "<p>Failed to load Hall of Fame.</p>";
  }
}

loadHallOfFame();

window.goLeaderboard = function () {

  window.location.href =
    "leaderboard.html";

};

</script>

</body>
</html>

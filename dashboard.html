<!DOCTYPE html>
<html>
<head>
  <title>HoverBird Dashboard</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <h2>Dashboard</h2>

  <div class="card">
  <p id="welcome">Loading user...</p>
  <p id="score">Best Score: ...</p>
</div>

  <button onclick="goToGame()">Play HoverBird</button>

<button onclick="goToLeaderboard()">Leaderboard</button>

<br><br>

<button onclick="logout()">Logout</button>

  <script type="module">
import { auth, db } from "./js/firebase-config.js";

import {
  onAuthStateChanged,
  signOut
} from "https://www.gstatic.com/firebasejs/12.14.0/firebase-auth.js";

import {
  doc,
  getDoc,
  updateDoc
} from "https://www.gstatic.com/firebasejs/12.14.0/firebase-firestore.js";

const welcome = document.getElementById("welcome");
const scoreText = document.getElementById("score");

let currentUser = null;

// ---------------- SEASON ----------------

function getCurrentSeason() {

  const now = new Date();

  const year = now.getFullYear();

  const month =
    String(now.getMonth() + 1).padStart(2, "0");

  return `${year}-${month}`;
}

// ---------------- AUTH ----------------

onAuthStateChanged(auth, async (user) => {

  if (!user) {
    window.location.href = "login.html";
    return;
  }

  await user.reload();

  if (!user.emailVerified) {
    window.location.href = "login.html";
    return;
  }

  currentUser = user;

  const userRef = doc(db, "users", user.uid);
  const userSnap = await getDoc(userRef);

  if (userSnap.exists()) {

    const data = userSnap.data();

    const currentSeason =
      getCurrentSeason();

    // Automatic monthly reset
    if (data.season !== currentSeason) {

      await updateDoc(userRef, {
        season: currentSeason,
        seasonScore: 0
      });

      data.season = currentSeason;
      data.seasonScore = 0;
    }

    welcome.innerText =
      "Welcome, " +
      (data.username || "Player");

    scoreText.innerText =
      "Best Score: " +
      (data.bestScore || 0);

  } else {

    welcome.innerText =
      "Welcome, Player";

    scoreText.innerText =
      "Best Score: 0";
  }

});

// ---------------- NAVIGATION ----------------

window.goToGame = function () {
  window.location.href = "game.html";
};

window.goToLeaderboard = function () {
  window.location.href = "leaderboard.html";
};

// ---------------- LOGOUT ----------------

window.logout = function () {

  signOut(auth);

  window.location.href =
    "login.html";
};

</script>

</body>
</html>

<!DOCTYPE html>
<html>
<head>
  <title>HoverBird Dashboard</title>
  <link rel="stylesheet" href="styles.css">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>

<body>

  <div class="clouds">
    <div class="cloud cloud1"></div>
    <div class="cloud cloud2"></div>
    <div class="cloud cloud3"></div>
  </div>

  <div class="dashboard-container">

    <div style="display:flex;justify-content:space-between;align-items:center;gap:10px;">
      <h2 style="margin:0;">Dashboard</h2>

      <!-- 🔊 SOUND TOGGLE -->
      <button id="soundToggle" style="padding:8px 12px;font-size:14px;">
        🔊
      </button>
    </div>

    <div class="card">
      <p id="welcome">Loading user...</p>
    </div>

    <div class="card">
      <p id="score">Best Score: ...</p>
    </div>

    <button onclick="goToGame()">🎮 Play HoverBird</button>
    <button onclick="goToLeaderboard()">🏆 Leaderboard</button>
    <button onclick="goToHowToPlay()">📖 How To Play</button>
    <button onclick="goToPrivacyPolicy()">🔒 Privacy Policy</button>
    <button onclick="logout()">🚪 Logout</button>

  </div>

  <!-- 🌤 Background Music -->
  <audio id="bgMusic" autoplay loop>
    <source src="assets/sounds/background.mp3" type="audio/mpeg">
  </audio>

  <!-- ══════════════════════════════════════
       FIREBASE + DASHBOARD LOGIC
  ══════════════════════════════════════ -->
  <script type="module">
    import { auth, db } from "./js/firebase-config.js";

    import {
      onAuthStateChanged,
      signOut
    } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-auth.js";

    import {
      doc,
      getDoc,
      updateDoc
    } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-firestore.js";

    const welcome = document.getElementById("welcome");
    const scoreText = document.getElementById("score");

    let currentUser = null;

    function getCurrentSeason() {
      const now = new Date();
      const year = now.getFullYear();
      const month = String(now.getMonth() + 1).padStart(2, "0");
      return `${year}-${month}`;
    }

    onAuthStateChanged(auth, async (user) => {

      if (!user) {
        window.location.href = "login.html";
        return;
      }

      await user.reload();

      if (!user.emailVerified) {
        window.location.href = "login.html";
        return;
      }

      currentUser = user;

      const userRef = doc(db, "users", user.uid);
      const userSnap = await getDoc(userRef);

      if (userSnap.exists()) {

        const data = userSnap.data();

        const currentSeason = getCurrentSeason();

        if (data.season !== currentSeason) {
          await updateDoc(userRef, {
            season: currentSeason,
            seasonScore: 0
          });

          data.season = currentSeason;
          data.seasonScore = 0;
        }

        welcome.innerText = "Welcome, " + (data.username || "Player");
        scoreText.innerText = "Best Score: " + (data.bestScore || 0);

      } else {
        welcome.innerText = "Welcome, Player";
        scoreText.innerText = "Best Score: 0";
      }

    });

    window.goToGame = () => window.location.href = "game.html";
    window.goToLeaderboard = () => window.location.href = "leaderboard.html";
    window.goToHowToPlay = () => window.location.href = "how-to-play.html";
    window.goToPrivacyPolicy = () => window.location.href = "privacy-policy.html";

    window.logout = function () {
      signOut(auth);
      window.location.href = "login.html";
    };
  </script>

  <!-- ══════════════════════════════════════
       SOUND SYSTEM (GLOBAL DASHBOARD CONTROL)
  ══════════════════════════════════════ -->
  <script>
    const bgMusic = document.getElementById("bgMusic");
    const soundToggle = document.getElementById("soundToggle");

    let soundEnabled =
      localStorage.getItem("soundEnabled") !== "false";

    bgMusic.volume = 0.2;

    function updateButton() {
      soundToggle.textContent = soundEnabled ? "🔊" : "🔇";
    }

    updateButton();

    if (soundEnabled) {
      bgMusic.play().catch(() => {});
    }

    soundToggle.addEventListener("click", () => {

      soundEnabled = !soundEnabled;

      localStorage.setItem("soundEnabled", soundEnabled);

      if (soundEnabled) {
        bgMusic.play().catch(() => {});
      } else {
        bgMusic.pause();
      }

      updateButton();
    });
  </script>

</body>
</html>

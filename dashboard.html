<!DOCTYPE html>
<html>
<head>
  <title>HoverBird Dashboard</title>
</head>
<body>

  <h2>Dashboard</h2>

  <p id="welcome">Loading user...</p>
  <p id="score">Best Score: ...</p>

  <button onclick="goToGame()">Play HoverBird</button>

<button onclick="goToLeaderboard()">Leaderboard</button>

<br><br>

<button onclick="logout()">Logout</button>

  <script type="module">
    import { auth, db } from "./js/firebase-config.js";

    import {
      onAuthStateChanged,
      signOut
    } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-auth.js";

    import {
      doc,
      getDoc
    } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-firestore.js";

    const welcome = document.getElementById("welcome");
    const scoreText = document.getElementById("score");

    let currentUser = null;

    // Check login state
    onAuthStateChanged(auth, async (user) => {

      if (!user) {
        window.location.href = "login.html";
        return;
      }

      await user.reload();

      if (!user.emailVerified) {
        window.location.href = "login.html";
        return;
      }

      currentUser = user;

      // Get user data from Firestore
      const userRef = doc(db, "users", user.uid);
      const userSnap = await getDoc(userRef);

      if (userSnap.exists()) {
        const data = userSnap.data();

        welcome.innerText = "Welcome, " + data.username;
        scoreText.innerText = "Best Score: " + (data.bestScore || 0);
      } else {
        welcome.innerText = "Welcome, Player";
        scoreText.innerText = "Best Score: 0";
      }

    });

    // Go to game
window.goToGame = function () {
  window.location.href = "game.html";
};

// Go to leaderboard
window.goToLeaderboard = function () {
  window.location.href = "leaderboard.html";
};

// Logout
window.logout = function () {
  signOut(auth);
  window.location.href = "login.html";
};

  </script>

</body>
</html>

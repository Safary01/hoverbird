<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HoverBird — Login</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet" />

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --sky-top:      #0a1628;
      --sky-mid:      #0d2a5c;
      --sky-low:      #1a4a8a;
      --gold:         #f5c842;
      --gold-dark:    #c9920a;
      --teal:         #00d4aa;
      --teal-dark:    #009977;
      --danger:       #ff5a5a;
      --danger-bg:    rgba(255,90,90,0.12);
      --success:      #00d4aa;
      --success-bg:   rgba(0,212,170,0.12);
      --white:        #ffffff;
      --text-soft:    rgba(255,255,255,0.65);
      --text-muted:   rgba(255,255,255,0.35);
      --card-bg:      rgba(255,255,255,0.06);
      --card-border:  rgba(255,255,255,0.12);
      --input-bg:     rgba(255,255,255,0.07);
      --input-border: rgba(255,255,255,0.15);
      --input-focus:  rgba(245,200,66,0.5);
    }

    html, body {
      min-height: 100%;
      font-family: 'Nunito', sans-serif;
      background: var(--sky-top);
      color: var(--white);
      overflow-x: hidden;
    }

    /* ── Background ─────────────────────────────────────────── */
    .sky {
      position: fixed; inset: 0;
      background: linear-gradient(180deg, var(--sky-top) 0%, var(--sky-mid) 55%, var(--sky-low) 100%);
      z-index: 0;
    }
    .stars { position: fixed; inset: 0; z-index: 1; pointer-events: none; }
    .star {
      position: absolute; background: #fff; border-radius: 50%;
      animation: twinkle var(--d,3s) ease-in-out infinite var(--delay,0s); opacity: 0;
    }
    @keyframes twinkle { 0%,100%{opacity:0} 50%{opacity:var(--op,0.8)} }

    .ground {
      position: fixed; bottom: 0; left: 0; right: 0; height: 70px;
      background: linear-gradient(180deg, #1a5c2a 0%, #0d3a18 100%);
      z-index: 3; border-top: 3px solid #2a8a3a;
    }
    .ground::before {
      content:''; position:absolute; top:-10px; left:0; right:0; height:10px;
      background: repeating-linear-gradient(90deg,#2a8a3a 0,#2a8a3a 30px,#1a5c2a 30px,#1a5c2a 60px);
    }

    /* ── Layout ─────────────────────────────────────────────── */
    .page {
      position: relative; z-index: 10;
      min-height: 100vh;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      padding: 2rem 1.5rem 100px;
    }

    /* ── Back link ──────────────────────────────────────────── */
    .back-link {
      position: fixed; top: 1.2rem; left: 1.4rem; z-index: 20;
      display: flex; align-items: center; gap: 0.4rem;
      color: var(--text-soft); text-decoration: none;
      font-size: 0.85rem; font-weight: 700; letter-spacing: 0.3px;
      transition: color 0.2s;
    }
    .back-link:hover { color: var(--white); }
    .back-link svg { width:18px; height:18px; stroke:currentColor; fill:none; stroke-width:2.5; stroke-linecap:round; stroke-linejoin:round; }

    /* ── Card ───────────────────────────────────────────────── */
    .card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-radius: 28px;
      padding: 2.8rem 2.5rem 2.5rem;
      width: 100%; max-width: 420px;
      box-shadow: 0 8px 40px rgba(0,0,0,0.45);
      animation: floatIn 0.6s cubic-bezier(0.22,1,0.36,1) both;
    }
    @keyframes floatIn { from{opacity:0;transform:translateY(24px)} to{opacity:1;transform:translateY(0)} }

    /* ── Header ─────────────────────────────────────────────── */
    .card-header {
      display: flex; flex-direction: column; align-items: center;
      gap: 0.5rem; margin-bottom: 2rem; text-align: center;
    }
    .logo-sm {
      width: 64px; height: 64px; object-fit: contain;
      filter: drop-shadow(0 3px 12px rgba(245,200,66,0.45));
      animation: bobble 3s ease-in-out infinite;
    }
    @keyframes bobble { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-7px)} }
    .card-title {
      font-family: 'Fredoka One', cursive;
      font-size: 1.9rem; letter-spacing: 0.5px;
      background: linear-gradient(135deg, var(--gold) 0%, #fff 100%);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .card-sub {
      font-size: 0.88rem; color: var(--text-soft); font-weight: 600;
    }

    /* ── Form ───────────────────────────────────────────────── */
    .form-group { margin-bottom: 1.1rem; }
    .form-label {
      display: block; font-size: 0.82rem; font-weight: 700;
      color: var(--text-soft); letter-spacing: 0.5px;
      margin-bottom: 0.45rem; text-transform: uppercase;
    }
    .input-wrap { position: relative; }
    .input-icon {
      position: absolute; left: 13px; top: 50%; transform: translateY(-50%);
      width: 18px; height: 18px; opacity: 0.45; pointer-events: none;
    }
    .input-icon svg { width:18px; height:18px; stroke:currentColor; fill:none; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }
    .form-input {
      width: 100%; padding: 0.8rem 1rem 0.8rem 2.6rem;
      background: var(--input-bg);
      border: 1.5px solid var(--input-border);
      border-radius: 12px; color: var(--white);
      font-family: 'Nunito', sans-serif; font-size: 0.98rem; font-weight: 600;
      outline: none; transition: border-color 0.2s, box-shadow 0.2s, background 0.2s;
      -webkit-text-fill-color: var(--white);
    }
    .form-input::placeholder { color: rgba(255,255,255,0.25); font-weight: 400; }
    .form-input:focus {
      border-color: var(--gold);
      box-shadow: 0 0 0 3px var(--input-focus);
      background: rgba(255,255,255,0.1);
    }
    .form-input.error { border-color: var(--danger); box-shadow: 0 0 0 3px rgba(255,90,90,0.2); }

    /* Password toggle */
    .pw-toggle {
      position: absolute; right: 12px; top: 50%; transform: translateY(-50%);
      background: none; border: none; cursor: pointer;
      color: var(--text-muted); padding: 2px;
      transition: color 0.2s;
    }
    .pw-toggle:hover { color: var(--text-soft); }
    .pw-toggle svg { width:18px; height:18px; stroke:currentColor; fill:none; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; display:block; }

    /* Forgot password row */
    .form-row {
      display: flex; justify-content: flex-end; margin-top: 0.3rem;
    }
    .link-sm {
      font-size: 0.8rem; font-weight: 700; color: var(--gold);
      text-decoration: none; letter-spacing: 0.2px; transition: opacity 0.2s;
    }
    .link-sm:hover { opacity: 0.75; }

    /* ── Alert ──────────────────────────────────────────────── */
    .alert {
      display: none; align-items: flex-start; gap: 0.6rem;
      padding: 0.75rem 1rem; border-radius: 10px;
      font-size: 0.85rem; font-weight: 700; margin-bottom: 1.1rem;
      line-height: 1.4;
    }
    .alert.show { display: flex; }
    .alert-error   { background: var(--danger-bg);  color: var(--danger);  border: 1px solid rgba(255,90,90,0.25); }
    .alert-success { background: var(--success-bg); color: var(--success); border: 1px solid rgba(0,212,170,0.25); }
    .alert svg { width:16px; height:16px; flex-shrink:0; margin-top:1px; stroke:currentColor; fill:none; stroke-width:2.5; stroke-linecap:round; stroke-linejoin:round; }

    /* ── Submit button ──────────────────────────────────────── */
    .btn-submit {
      width: 100%; padding: 0.95rem;
      background: linear-gradient(135deg, var(--gold) 0%, #e6a800 100%);
      color: #1a0f00; font-family: 'Nunito', sans-serif;
      font-size: 1.05rem; font-weight: 800;
      border: none; border-radius: 14px; cursor: pointer;
      box-shadow: 0 4px 20px rgba(245,200,66,0.4);
      transition: transform 0.15s, box-shadow 0.15s, filter 0.15s;
      letter-spacing: 0.3px; position: relative;
      display: flex; align-items: center; justify-content: center; gap: 0.5rem;
      margin-top: 0.5rem;
    }
    .btn-submit:hover:not(:disabled) {
      filter: brightness(1.08);
      box-shadow: 0 6px 28px rgba(245,200,66,0.55);
      transform: translateY(-2px);
    }
    .btn-submit:active:not(:disabled) { transform: scale(0.97); }
    .btn-submit:disabled { opacity: 0.6; cursor: not-allowed; }

    /* Spinner inside button */
    .btn-spinner {
      display: none; width:18px; height:18px;
      border: 2.5px solid rgba(26,15,0,0.3);
      border-top-color: #1a0f00; border-radius: 50%;
      animation: spin 0.75s linear infinite;
    }
    .btn-submit.loading .btn-spinner { display: block; }
    .btn-submit.loading .btn-text { opacity: 0.6; }
    @keyframes spin { to{transform:rotate(360deg)} }

    /* ── Divider ────────────────────────────────────────────── */
    .divider {
      display: flex; align-items: center; gap: 0.75rem;
      margin: 1.4rem 0; color: var(--text-muted);
      font-size: 0.75rem; font-weight: 700; letter-spacing: 1px;
    }
    .divider::before, .divider::after {
      content:''; flex:1; height:1px; background: rgba(255,255,255,0.1);
    }

    /* ── Google button ──────────────────────────────────────── */
    .btn-google {
      width: 100%; padding: 0.85rem;
      background: rgba(255,255,255,0.07);
      color: var(--white); font-family: 'Nunito', sans-serif;
      font-size: 0.98rem; font-weight: 700;
      border: 1.5px solid rgba(255,255,255,0.15); border-radius: 14px;
      cursor: pointer; transition: background 0.2s, border-color 0.2s, transform 0.15s;
      display: flex; align-items: center; justify-content: center; gap: 0.65rem;
    }
    .btn-google:hover { background: rgba(255,255,255,0.12); border-color: rgba(255,255,255,0.25); transform: translateY(-1px); }
    .btn-google:active { transform: scale(0.97); }
    .google-icon { width:20px; height:20px; flex-shrink:0; }

    /* ── Footer ─────────────────────────────────────────────── */
    .card-footer {
      text-align: center; margin-top: 1.6rem;
      font-size: 0.88rem; color: var(--text-soft); font-weight: 600;
    }
    .card-footer a {
      color: var(--teal); text-decoration: none; font-weight: 800;
      transition: opacity 0.2s;
    }
    .card-footer a:hover { opacity: 0.75; }

    /* ── Responsive ─────────────────────────────────────────── */
    @media (max-width: 440px) {
      .card { padding: 2.2rem 1.4rem 2rem; border-radius: 20px; }
      .card-title { font-size: 1.6rem; }
    }
  </style>
</head>
<body>

  <div class="sky"></div>
  <div class="stars" id="stars"></div>
  <div class="ground"></div>

  <!-- Back to home -->
  <a href="index.html" class="back-link">
    <svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg>
    Home
  </a>

  <main class="page">
    <div class="card">

      <!-- Header -->
      <div class="card-header">
        <img
          src="https://raw.githubusercontent.com/Safary01/hoverbird/main/assets/images/hoverbird.png"
          alt="HoverBird" class="logo-sm"
          onerror="this.style.display='none'"
        />
        <h1 class="card-title">Welcome Back</h1>
        <p class="card-sub">Sign in to your HoverBird account</p>
      </div>

      <!-- Error / success alerts -->
      <div class="alert alert-error" id="alert-error" role="alert">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
        <span id="alert-error-text"></span>
      </div>
      <div class="alert alert-success" id="alert-success" role="alert">
        <svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>
        <span id="alert-success-text"></span>
      </div>

      <!-- Login form -->
      <form id="login-form" novalidate>

        <!-- Email -->
        <div class="form-group">
          <label class="form-label" for="email">Email</label>
          <div class="input-wrap">
            <span class="input-icon"><svg viewBox="0 0 24 24"><rect x="2" y="4" width="20" height="16" rx="2"/><polyline points="2,4 12,13 22,4"/></svg></span>
            <input
              type="email" id="email" name="email"
              class="form-input" placeholder="you@example.com"
              autocomplete="email" required
            />
          </div>
        </div>

        <!-- Password -->
        <div class="form-group">
          <label class="form-label" for="password">Password</label>
          <div class="input-wrap">
            <span class="input-icon"><svg viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg></span>
            <input
              type="password" id="password" name="password"
              class="form-input" placeholder="••••••••"
              autocomplete="current-password" required
            />
            <button type="button" class="pw-toggle" id="pw-toggle" aria-label="Toggle password visibility">
              <svg id="eye-icon" viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
          </div>
          <div class="form-row">
            <a href="forgot-password.html" class="link-sm">Forgot password?</a>
          </div>
        </div>

        <!-- Submit -->
        <button type="submit" class="btn-submit" id="login-btn">
          <div class="btn-spinner" id="btn-spinner"></div>
          <span class="btn-text">🎮 Sign In & Play</span>
        </button>
      </form>

      <!-- Divider -->
      <div class="divider">or continue with</div>

      <!-- Google sign-in -->
      <button class="btn-google" id="google-btn">
        <svg class="google-icon" viewBox="0 0 48 48">
          <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
          <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
          <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
          <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
        </svg>
        Continue with Google
      </button>

      <!-- Footer -->
      <p class="card-footer">
        Don't have an account? <a href="register.html">Create one</a>
      </p>

    </div>
  </main>

  <!-- Firebase logic -->
  <script type="module">
    import { auth } from "./js/firebase-config.js";
    import {
      signInWithEmailAndPassword,
      GoogleAuthProvider,
      signInWithPopup,
      onAuthStateChanged
    } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
    import { doc, getDoc, setDoc, serverTimestamp }
      from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
    import { db } from "./js/firebase-config.js";

    // ── Redirect if already logged in ──────────────────────
    onAuthStateChanged(auth, (user) => {
      if (user) window.location.replace("dashboard.html");
    });

    // ── Helpers ────────────────────────────────────────────
    const loginBtn   = document.getElementById("login-btn");
    const spinner    = document.getElementById("btn-spinner");
    const errorBox   = document.getElementById("alert-error");
    const errorText  = document.getElementById("alert-error-text");
    const successBox = document.getElementById("alert-success");
    const successText= document.getElementById("alert-success-text");

    function showError(msg) {
      errorText.textContent = msg;
      errorBox.classList.add("show");
      successBox.classList.remove("show");
    }
    function showSuccess(msg) {
      successText.textContent = msg;
      successBox.classList.add("show");
      errorBox.classList.remove("show");
    }
    function clearAlerts() {
      errorBox.classList.remove("show");
      successBox.classList.remove("show");
    }
    function setLoading(on) {
      loginBtn.disabled = on;
      loginBtn.classList.toggle("loading", on);
    }

    // Map Firebase error codes → friendly messages
    function friendlyError(code) {
      const map = {
        "auth/user-not-found":       "No account found with that email.",
        "auth/wrong-password":       "Incorrect password. Please try again.",
        "auth/invalid-email":        "Please enter a valid email address.",
        "auth/user-disabled":        "This account has been disabled.",
        "auth/too-many-requests":    "Too many attempts. Please wait a moment.",
        "auth/network-request-failed":"Network error. Check your connection.",
        "auth/invalid-credential":   "Email or password is incorrect.",
        "auth/popup-closed-by-user": "Sign-in popup was closed. Please try again.",
      };
      return map[code] || "Something went wrong. Please try again.";
    }

    // Ensure Firestore user doc exists (for Google sign-in new users)
    async function ensureUserDoc(user) {
      const ref = doc(db, "users", user.uid);
      const snap = await getDoc(ref);
      if (!snap.exists()) {
        await setDoc(ref, {
          username:    user.displayName || user.email.split("@")[0],
          email:       user.email,
          bestScore:   0,
          seasonScore: 0,
          createdAt:   serverTimestamp(),
        });
      }
    }

    // ── Email / Password Login ──────────────────────────────
    document.getElementById("login-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      clearAlerts();

      const email    = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;

      if (!email || !password) {
        showError("Please fill in all fields.");
        return;
      }

      setLoading(true);
      try {
        await signInWithEmailAndPassword(auth, email, password);
        showSuccess("Login successful! Redirecting…");
        setTimeout(() => window.location.replace("dashboard.html"), 800);
      } catch (err) {
        showError(friendlyError(err.code));
        setLoading(false);
      }
    });

    // ── Google Sign-In ──────────────────────────────────────
    document.getElementById("google-btn").addEventListener("click", async () => {
      clearAlerts();
      const provider = new GoogleAuthProvider();
      try {
        const result = await signInWithPopup(auth, provider);
        await ensureUserDoc(result.user);
        showSuccess("Signed in with Google! Redirecting…");
        setTimeout(() => window.location.replace("dashboard.html"), 800);
      } catch (err) {
        showError(friendlyError(err.code));
      }
    });

    // ── Password visibility toggle ──────────────────────────
    const pwInput  = document.getElementById("password");
    const pwToggle = document.getElementById("pw-toggle");
    const eyeIcon  = document.getElementById("eye-icon");

    const eyeOpen   = `<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>`;
    const eyeClosed = `<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/><path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/><line x1="1" y1="1" x2="23" y2="23"/>`;

    pwToggle.addEventListener("click", () => {
      const isHidden = pwInput.type === "password";
      pwInput.type   = isHidden ? "text" : "password";
      eyeIcon.innerHTML = isHidden ? eyeClosed : eyeOpen;
    });
  </script>

  <!-- Stars -->
  <script>
    const c = document.getElementById("stars");
    for (let i = 0; i < 70; i++) {
      const s = document.createElement("div");
      s.className = "star";
      const sz = Math.random()*2+0.5;
      s.style.cssText=`width:${sz}px;height:${sz}px;top:${Math.random()*70}%;left:${Math.random()*100}%;--d:${(Math.random()*3+2).toFixed(1)}s;--delay:-${(Math.random()*4).toFixed(1)}s;--op:${(Math.random()*0.5+0.4).toFixed(2)};`;
      c.appendChild(s);
    }
  </script>

</body>
</html>

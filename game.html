<!DOCTYPE html>
<html>
<head>
  <title>HoverBird</title>
  <link rel="stylesheet" href="styles.css">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
  body {
    margin: 0;
    overflow: auto;
    text-align: center;
    font-family: Arial, sans-serif;
    background: #87CEEB;
  }

  h2 {
    margin: 10px;
  }

  canvas {
    display: block;
    margin: auto;
    width: 100%;
    max-width: 360px;
    background: #87CEEB;
    border: 2px solid #333;
  }

  #ui {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    display: none;
    justify-content: center;
    align-items: center;
    background: rgba(0, 0, 0, 0.7);
    z-index: 1000;
  }

  #ui .panel {
    background: white;
    padding: 20px;
    border-radius: 12px;
    text-align: center;
    width: 90%;
    max-width: 300px;
  }

  button {
    padding: 12px 20px;
    margin: 6px;
    font-size: 16px;
    cursor: pointer;
    border: none;
    border-radius: 6px;
  }

  #soundToggle {
    position: absolute;
    top: 10px;
    right: 10px;
    z-index: 2000;
    font-size: 16px;
  }
</style>
</head>

<body>

<h2>HoverBird</h2>

<button id="soundToggle">🔊</button>

<canvas id="gameCanvas" width="360" height="640"></canvas>
<div id="ui"></div>

<script type="module">

import { auth, db } from "./js/firebase-config.js";
import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-auth.js";
import { doc, getDoc, setDoc, updateDoc } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-firestore.js";

const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");
const ui = document.getElementById("ui");

// ---------------- SOUND STATE ----------------
let soundEnabled = localStorage.getItem("soundEnabled") !== "false";

const soundToggle = document.getElementById("soundToggle");

function updateSoundIcon() {
  soundToggle.textContent = soundEnabled ? "🔊" : "🔇";
}
updateSoundIcon();

soundToggle.onclick = () => {
  soundEnabled = !soundEnabled;
  localStorage.setItem("soundEnabled", soundEnabled);
  updateSoundIcon();
};

// ---------------- SOUNDS ----------------
const scoreSound = new Audio("assets/sounds/score.mp3");
const gameOverSound = new Audio("assets/sounds/game-over.mp3");
const bestScoreSound = new Audio("assets/sounds/best-score.mp3");

scoreSound.preload = "auto";
gameOverSound.preload = "auto";
bestScoreSound.preload = "auto";

function playScoreSound() {
  if (!soundEnabled) return;

  const s = scoreSound.cloneNode();
  s.volume = 1;
  s.play().catch(() => {});
}

function playSound(sound) {
  if (!soundEnabled) return;

  sound.currentTime = 0;
  sound.play().catch(() => {});
}

// ---------------- STATE ----------------
let gameStarted = false;
let gameOver = false;
let score = 0;
let pipeTimer = null;
let bestScore = 0;

// ---------------- BIRD ----------------
const birdImage = new Image();
birdImage.src = "assets/images/bird.png";

const bird = {
  x: 120,
  y: 320,
  velocity: 0,
  gravity: 0.5,
  flapPower: -8,
  width: 40,
  height: 40
};

// ---------------- CLOUDS ----------------
const clouds = [
  { x: 50, y: 80, speed: 0.3 },
  { x: 220, y: 150, speed: 0.2 },
  { x: 120, y: 250, speed: 0.4 },
  { x: 300, y: 120, speed: 0.25 }
];

// ---------------- PIPES ----------------
const pipes = [];
const PIPE_WIDTH = 60;
const PIPE_GAP = 200;
const PIPE_SPEED = 1.5;
const GROUND_HEIGHT = 60;

// ---------------- AUTH ----------------
onAuthStateChanged(auth, async (user) => {
  if (!user) {
    window.location.href = "login.html";
    return;
  }

  const ref = doc(db, "users", user.uid);
  const snap = await getDoc(ref);

  if (snap.exists()) {
    bestScore = snap.data().bestScore || 0;
  }
});

// ---------------- START GAME ----------------
function startGame() {
  if (gameStarted) return;

  gameStarted = true;
  ui.style.display = "none";

  pipeTimer = setInterval(() => {
    if (!gameOver) createPipe();
  }, 3000);
}

// ---------------- FLAP ----------------
function flap() {
  if (gameOver) return;

  if (!gameStarted) startGame();

  bird.velocity = bird.flapPower;
}

// ---------------- PIPE ----------------
function createPipe() {
  const topHeight = Math.random() * (350 - 80) + 80;

  pipes.push({
    x: canvas.width,
    topHeight,
    passed: false
  });
}

// ---------------- INPUT ----------------
canvas.addEventListener("click", flap);
canvas.addEventListener("touchstart", (e) => {
  e.preventDefault();
  flap();
});

// ---------------- END GAME ----------------
function getCurrentSeason() {
  const now = new Date();
  return `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, "0")}`;
}

async function endGame() {
  if (gameOver) return;

  gameOver = true;
  playSound(gameOverSound);

  if (pipeTimer) clearInterval(pipeTimer);

  const user = auth.currentUser;
  let isNewBest = false;

  if (user) {
    const ref = doc(db, "users", user.uid);
    const snap = await getDoc(ref);

    if (snap.exists()) {
      const data = snap.data();

      if (score > (data.bestScore || 0)) {
        await updateDoc(ref, { bestScore: score });
        isNewBest = true;
        playSound(bestScoreSound);
      }
    }
  }

  ui.style.display = "flex";
  ui.innerHTML = `
    <div class="panel">
      <h2>Game Over</h2>
      <p>Score: ${score}</p>
      ${isNewBest ? "<p>🎉 New Best Score!</p>" : ""}
      <button onclick="restartGame()">Play Again</button>
      <button onclick="goDashboard()">Dashboard</button>
    </div>
  `;
}

// ---------------- UPDATE ----------------
function update() {
  if (!gameStarted || gameOver) return;

  bird.velocity += bird.gravity;
  bird.y += bird.velocity;

  for (let i = pipes.length - 1; i >= 0; i--) {
    const pipe = pipes[i];
    pipe.x -= PIPE_SPEED;

    if (!pipe.passed && pipe.x + PIPE_WIDTH < bird.x) {
      pipe.passed = true;
      score++;
      playScoreSound(); // FIXED: now always runs correctly
    }

    const collision =
      bird.x + bird.width > pipe.x &&
      bird.x < pipe.x + PIPE_WIDTH &&
      (bird.y < pipe.topHeight ||
        bird.y + bird.height > pipe.topHeight + PIPE_GAP);

    if (collision) endGame();
  }

  if (bird.y > canvas.height - GROUND_HEIGHT - bird.height) {
    endGame();
  }
}

// ---------------- DRAW ----------------
function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  // clouds
  for (const cloud of clouds) {
    cloud.x -= cloud.speed;
    if (cloud.x < -80) cloud.x = canvas.width + 80;

    ctx.fillStyle = "rgba(255,255,255,0.85)";
    ctx.beginPath();
    ctx.arc(cloud.x, cloud.y, 18, 0, Math.PI * 2);
    ctx.arc(cloud.x + 20, cloud.y - 10, 22, 0, Math.PI * 2);
    ctx.arc(cloud.x + 42, cloud.y, 18, 0, Math.PI * 2);
    ctx.fill();
  }

  // pipes
  ctx.fillStyle = "green";
  for (const pipe of pipes) {
    ctx.fillRect(pipe.x, 0, PIPE_WIDTH, pipe.topHeight);
    ctx.fillRect(pipe.x, pipe.topHeight + PIPE_GAP, PIPE_WIDTH, canvas.height);
  }

  // bird
  ctx.drawImage(birdImage, bird.x, bird.y, bird.width, bird.height);

  // ground
  ctx.fillStyle = "#c2b280";
  ctx.fillRect(0, canvas.height - GROUND_HEIGHT, canvas.width, GROUND_HEIGHT);

  // score
  ctx.fillStyle = "black";
  ctx.fillText("Score: " + score, 10, 30);

  // ✅ RESTORED START SCREEN
  if (!gameStarted && !gameOver) {
    ctx.fillStyle = "rgba(0,0,0,0.5)";
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    ctx.fillStyle = "white";
    ctx.font = "30px Arial";
    ctx.fillText("HoverBird", 100, 250);

    ctx.font = "20px Arial";
    ctx.fillText("Tap to Start", 120, 300);
  }
}

// ---------------- LOOP ----------------
function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}

birdImage.onload = () => loop();

window.restartGame = () => location.reload();
window.goDashboard = () => window.location.href = "dashboard.html";

</script>

</body>
  </html>

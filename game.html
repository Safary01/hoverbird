<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>HoverBird — Play</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;700;800&display=swap" rel="stylesheet" />

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --gold:       #f5c842;
      --teal:       #00d4aa;
      --teal-dark:  #009977;
      --danger:     #ff5a5a;
      --white:      #ffffff;
      --sky-top:    #0a1628;
      --text-soft:  rgba(255,255,255,0.65);
      --card-bg:    rgba(10,22,40,0.88);
      --card-border:rgba(255,255,255,0.12);
    }

    html, body {
      width: 100%; height: 100%;
      overflow: hidden;
      background: #0a1628;
      font-family: 'Nunito', sans-serif;
      color: var(--white);
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
    }

    /* ── Canvas wrapper ─────────────────────────────────────── */
    #game-wrapper {
      position: relative;
      width: 100%; height: 100%;
      display: flex; align-items: center; justify-content: center;
    }
    #gameCanvas {
      display: block;
      max-width: 100%;
      max-height: 100%;
      image-rendering: pixelated;
    }

    /* ── HUD (on top of canvas) ─────────────────────────────── */
    #hud {
      position: absolute;
      top: 0; left: 50%;
      transform: translateX(-50%);
      width: 100%; max-width: 480px;
      pointer-events: none;
      padding: 1rem 1.2rem 0;
      display: flex; align-items: flex-start; justify-content: space-between;
      z-index: 10;
    }

    /* Score display */
    .hud-score {
      font-family: 'Fredoka One', cursive;
      font-size: 2.8rem; line-height: 1;
      color: var(--white);
      text-shadow: 0 2px 12px rgba(0,0,0,0.6), 0 0 20px rgba(245,200,66,0.3);
      display: none;
    }
    .hud-score.visible { display: block; }

    /* Best score badge */
    .hud-best {
      font-size: 0.78rem; font-weight: 800;
      color: var(--gold);
      background: rgba(0,0,0,0.35);
      border: 1px solid rgba(245,200,66,0.25);
      border-radius: 100px; padding: 0.3rem 0.75rem;
      display: none;
    }
    .hud-best.visible { display: block; }

    /* Pause button */
    #pause-btn {
      position: absolute;
      top: 1rem; right: 1.2rem;
      pointer-events: all;
      background: rgba(0,0,0,0.35);
      border: 1px solid rgba(255,255,255,0.18);
      border-radius: 10px; padding: 0.45rem 0.6rem;
      cursor: pointer; display: none;
      transition: background 0.2s;
    }
    #pause-btn.visible { display: flex; align-items: center; justify-content: center; }
    #pause-btn:hover { background: rgba(0,0,0,0.55); }
    #pause-btn svg { width:20px; height:20px; stroke:#fff; fill:none; stroke-width:2.5; stroke-linecap:round; }

    /* Sound toggle */
    #sound-btn {
      position: absolute;
      top: 1rem; right: 4.2rem;
      pointer-events: all;
      background: rgba(0,0,0,0.35);
      border: 1px solid rgba(255,255,255,0.18);
      border-radius: 10px; padding: 0.45rem 0.6rem;
      cursor: pointer; display: none;
      transition: background 0.2s;
    }
    #sound-btn.visible { display: flex; align-items: center; justify-content: center; }
    #sound-btn:hover { background: rgba(0,0,0,0.55); }
    #sound-btn svg { width:20px; height:20px; stroke:#fff; fill:none; stroke-width:2.5; stroke-linecap:round; }

    /* ── Overlays ────────────────────────────────────────────── */
    .overlay {
      position: absolute;
      top: 0; left: 50%; transform: translateX(-50%);
      width: 100%; max-width: 480px; height: 100%;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      z-index: 20; padding: 1.5rem;
      pointer-events: none;
    }
    .overlay.active { pointer-events: all; }

    .overlay-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
      border-radius: 24px;
      padding: 2rem 2rem 1.8rem;
      width: 100%; max-width: 340px;
      text-align: center;
      box-shadow: 0 8px 40px rgba(0,0,0,0.6);
      animation: popIn 0.35s cubic-bezier(0.34,1.56,0.64,1) both;
    }
    @keyframes popIn { from{transform:scale(0.85);opacity:0} to{transform:scale(1);opacity:1} }

    .overlay-logo {
      width: 70px; height: 70px; object-fit: contain;
      filter: drop-shadow(0 3px 12px rgba(245,200,66,0.45));
      animation: bobble 3s ease-in-out infinite;
      margin-bottom: 0.6rem;
    }
    @keyframes bobble { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-8px)} }

    .overlay-title {
      font-family: 'Fredoka One', cursive;
      font-size: 2rem; margin-bottom: 0.2rem;
      background: linear-gradient(135deg, var(--gold) 0%, #fff 100%);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
    }
    .overlay-sub {
      font-size: 0.88rem; color: var(--text-soft); font-weight: 700;
      margin-bottom: 1.6rem; line-height: 1.5;
    }

    /* Score panel on game over */
    .score-panel {
      display: flex; gap: 0.75rem; margin-bottom: 1.4rem;
    }
    .score-box {
      flex: 1; background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 14px; padding: 0.8rem 0.5rem;
    }
    .score-box-label {
      font-size: 0.7rem; font-weight: 800; color: var(--text-soft);
      letter-spacing: 0.8px; text-transform: uppercase; margin-bottom: 0.3rem;
    }
    .score-box-val {
      font-family: 'Fredoka One', cursive; font-size: 1.8rem; line-height: 1;
    }
    .score-box-val.gold { color: var(--gold); }
    .score-box-val.teal { color: var(--teal); }

    /* New best badge */
    .new-best-badge {
      display: none;
      background: linear-gradient(135deg, var(--gold), #e6a800);
      color: #1a0f00; font-size: 0.75rem; font-weight: 800;
      border-radius: 100px; padding: 0.25rem 0.75rem;
      letter-spacing: 0.5px; margin-bottom: 1rem;
      animation: shine 1s ease-in-out infinite alternate;
    }
    .new-best-badge.show { display: inline-block; }
    @keyframes shine { from{box-shadow:0 0 8px rgba(245,200,66,0.4)} to{box-shadow:0 0 20px rgba(245,200,66,0.8)} }

    /* Saving indicator */
    .saving-text {
      font-size: 0.78rem; color: var(--text-soft); font-weight: 700;
      margin-bottom: 0.8rem; min-height: 1.1rem;
    }

    /* Buttons inside overlays */
    .ov-btn {
      width: 100%; padding: 0.9rem;
      border-radius: 14px; border: none; cursor: pointer;
      font-family: 'Nunito', sans-serif; font-size: 1rem; font-weight: 800;
      display: flex; align-items: center; justify-content: center; gap: 0.5rem;
      text-decoration: none;
      transition: transform 0.15s, filter 0.15s, box-shadow 0.15s;
      margin-bottom: 0.65rem;
    }
    .ov-btn:last-child { margin-bottom: 0; }
    .ov-btn:active { transform: scale(0.97); }

    .ov-btn-gold {
      background: linear-gradient(135deg, var(--gold) 0%, #e6a800 100%);
      color: #1a0f00; box-shadow: 0 4px 18px rgba(245,200,66,0.4);
    }
    .ov-btn-gold:hover { filter: brightness(1.08); box-shadow: 0 6px 26px rgba(245,200,66,0.55); transform: translateY(-1px); }

    .ov-btn-teal {
      background: linear-gradient(135deg, var(--teal) 0%, var(--teal-dark) 100%);
      color: #001a14; box-shadow: 0 4px 18px rgba(0,212,170,0.3);
    }
    .ov-btn-teal:hover { filter: brightness(1.08); box-shadow: 0 6px 26px rgba(0,212,170,0.45); transform: translateY(-1px); }

    .ov-btn-ghost {
      background: rgba(255,255,255,0.07);
      color: var(--text-soft); border: 1px solid rgba(255,255,255,0.14);
    }
    .ov-btn-ghost:hover { background: rgba(255,255,255,0.12); color: var(--white); }

    /* How to play hint */
    .tap-hint {
      font-size: 0.82rem; color: var(--text-soft); font-weight: 700;
      margin-top: 1rem; animation: pulse-op 1.5s ease-in-out infinite;
    }
    @keyframes pulse-op { 0%,100%{opacity:0.5} 50%{opacity:1} }

    /* ── Loading screen ─────────────────────────────────────── */
    #loading-screen {
      position: fixed; inset: 0; background: var(--sky-top);
      z-index: 999; display: flex; align-items: center;
      justify-content: center; flex-direction: column; gap: 1rem;
      transition: opacity 0.4s ease;
    }
    #loading-screen.hidden { opacity: 0; pointer-events: none; }
    .spinner {
      width: 40px; height: 40px;
      border: 3px solid rgba(245,200,66,0.2);
      border-top-color: var(--gold);
      border-radius: 50%; animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

  <!-- Loading -->
  <div id="loading-screen">
    <div class="spinner"></div>
  </div>

  <div id="game-wrapper">

    <!-- Game canvas -->
    <canvas id="gameCanvas"></canvas>

    <!-- HUD -->
    <div id="hud">
      <div class="hud-score" id="hud-score">0</div>
      <div class="hud-best"  id="hud-best">Best: 0</div>
    </div>
    <button id="pause-btn" aria-label="Pause">
      <svg id="pause-icon" viewBox="0 0 24 24"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg>
    </button>
    <button id="sound-btn" aria-label="Toggle sound">
      <svg id="sound-icon" viewBox="0 0 24 24"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path id="sound-waves" d="M15.54 8.46a5 5 0 0 1 0 7.07M19.07 4.93a10 10 0 0 1 0 14.14"/></svg>
    </button>

    <!-- START overlay -->
    <div class="overlay active" id="overlay-start">
      <div class="overlay-card">
        <img
          src="https://raw.githubusercontent.com/Safary01/hoverbird/main/assets/images/hoverbird.png"
          alt="HoverBird" class="overlay-logo"
          onerror="this.style.display='none'"
        />
        <h1 class="overlay-title">HoverBird</h1>
        <p class="overlay-sub">Tap or press Space to flap.<br>Dodge the pipes. Beat your best!</p>
        <button class="ov-btn ov-btn-gold" id="start-btn">
          🐦 Start Flying
        </button>
        <a href="dashboard.html" class="ov-btn ov-btn-ghost">
          ← Back to Dashboard
        </a>
        <p class="tap-hint">Tap anywhere to begin</p>
      </div>
    </div>

    <!-- PAUSE overlay -->
    <div class="overlay" id="overlay-pause">
      <div class="overlay-card">
        <h1 class="overlay-title">⏸ Paused</h1>
        <p class="overlay-sub">Take a breath. The pipes will wait.</p>
        <button class="ov-btn ov-btn-gold" id="resume-btn">
          ▶ Resume
        </button>
        <a href="dashboard.html" class="ov-btn ov-btn-ghost">
          ← Dashboard
        </a>
      </div>
    </div>

    <!-- GAME OVER overlay -->
    <div class="overlay" id="overlay-gameover">
      <div class="overlay-card">
        <h1 class="overlay-title">💥 Game Over</h1>
        <div class="new-best-badge" id="new-best-badge">🏆 New Best Score!</div>

        <div class="score-panel">
          <div class="score-box">
            <p class="score-box-label">Score</p>
            <p class="score-box-val gold" id="go-score">0</p>
          </div>
          <div class="score-box">
            <p class="score-box-label">Best</p>
            <p class="score-box-val teal" id="go-best">0</p>
          </div>
          <div class="score-box">
            <p class="score-box-label">Season</p>
            <p class="score-box-val" id="go-season">0</p>
          </div>
        </div>

        <p class="saving-text" id="saving-text">💾 Saving score…</p>

        <button class="ov-btn ov-btn-gold" id="retry-btn">
          🔄 Play Again
        </button>
        <a href="leaderboard.html" class="ov-btn ov-btn-teal">
          📊 Leaderboard
        </a>
        <a href="dashboard.html" class="ov-btn ov-btn-ghost">
          ← Dashboard
        </a>
      </div>
    </div>

  </div><!-- /game-wrapper -->

  <!-- Firebase score logic -->
  <script type="module">
    import { auth, db } from "./js/firebase-config.js";
    import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
    import {
      doc, getDoc, updateDoc, increment
    } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

    const loadingScreen = document.getElementById("loading-screen");
    let currentUser  = null;
    let userBest     = 0;
    let userSeason   = 0;

    onAuthStateChanged(auth, async (user) => {
      if (!user) { window.location.replace("login.html"); return; }
      currentUser = user;

      const snap = await getDoc(doc(db, "users", user.uid));
      if (snap.exists()) {
        const d      = snap.data();
        userBest     = d.bestScore   || 0;
        userSeason   = d.seasonScore || 0;
      }

      // Update HUD best
      document.getElementById("hud-best").textContent = `Best: ${userBest}`;

      // Hide loading, start game
      loadingScreen.classList.add("hidden");
      setTimeout(() => { loadingScreen.remove(); initGame(); }, 400);
    });

    // ── Save score to Firestore ────────────────────────────
    window.saveScore = async function(score) {
      if (!currentUser) return;
      const savingEl = document.getElementById("saving-text");

      try {
        const ref     = doc(db, "users", currentUser.uid);
        const updates = { gamesPlayed: increment(1) };
        let newBest   = userBest;
        let newSeason = userSeason;

        if (score > userBest) {
          updates.bestScore = score;
          newBest = score;
        }
        if (score > userSeason) {
          updates.seasonScore = score;
          newSeason = score;
        }

        await updateDoc(ref, updates);
        userBest   = newBest;
        userSeason = newSeason;

        savingEl.textContent = "✅ Score saved!";

        // Update game over overlay
        document.getElementById("go-best").textContent   = userBest.toLocaleString();
        document.getElementById("go-season").textContent = userSeason.toLocaleString();
        document.getElementById("hud-best").textContent  = `Best: ${userBest}`;

      } catch (err) {
        console.error("Save error:", err);
        savingEl.textContent = "⚠️ Could not save. Check connection.";
      }
    };

    window.getUserBest   = () => userBest;
    window.getUserSeason = () => userSeason;
  </script>

  <!-- Game Engine -->
  <script>
    function initGame() {
      const canvas  = document.getElementById("gameCanvas");
      const ctx     = canvas.getContext("2d");

      // ── Canvas sizing ────────────────────────────────────
      const W = 480, H = 640;
      canvas.width  = W;
      canvas.height = H;

      // ── Game constants ───────────────────────────────────
      const GRAVITY      = 0.45;
      const FLAP_FORCE   = -9;
      const PIPE_WIDTH   = 68;
      const PIPE_GAP     = 165;
      const PIPE_SPEED   = 2.8;
      const PIPE_SPAWN_X = 520;
      const PIPE_INTERVAL= 90;  // frames
      const GROUND_H     = 80;
      const BIRD_X       = 110;
      const BIRD_SIZE    = 36;

      // ── State ────────────────────────────────────────────
      let state       = "start";   // start | playing | paused | gameover
      let score       = 0;
      let frame       = 0;
      let pipes       = [];
      let particles   = [];
      let soundOn     = true;
      let animId      = null;
      let newBest     = false;

      // Bird
      let bird = { y: H/2, vy: 0, angle: 0, flapAnim: 0 };

      // Clouds
      let clouds = [
        { x: 80,  y: 80,  w: 120, s: 0.4 },
        { x: 260, y: 140, w: 90,  s: 0.3 },
        { x: 400, y: 60,  w: 150, s: 0.5 },
        { x: 160, y: 200, w: 100, s: 0.35},
      ];

      // Stars (for background)
      const stars = Array.from({ length: 50 }, () => ({
        x: Math.random() * W,
        y: Math.random() * (H * 0.6),
        r: Math.random() * 1.5 + 0.3,
        op: Math.random() * 0.6 + 0.2,
        phase: Math.random() * Math.PI * 2,
      }));

      // Ground scroll
      let groundX = 0;

      // ── Audio (Web Audio API tones) ───────────────────────
      let audioCtx = null;
      function getAudio() {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        return audioCtx;
      }
      function playTone(freq, type, dur, vol = 0.18) {
        if (!soundOn) return;
        try {
          const ac  = getAudio();
          const osc = ac.createOscillator();
          const gain= ac.createGain();
          osc.connect(gain); gain.connect(ac.destination);
          osc.type      = type;
          osc.frequency.setValueAtTime(freq, ac.currentTime);
          gain.gain.setValueAtTime(vol, ac.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, ac.currentTime + dur);
          osc.start(); osc.stop(ac.currentTime + dur);
        } catch(e) {}
      }
      function sfxFlap()    { playTone(520, "sine",   0.08, 0.15); }
      function sfxScore()   { playTone(880, "sine",   0.12, 0.2); setTimeout(()=>playTone(1100,"sine",0.1,0.15),80); }
      function sfxDie()     { playTone(160, "sawtooth",0.4, 0.25); setTimeout(()=>playTone(100,"sawtooth",0.5,0.2),150); }
      function sfxNewBest() {
        [523,659,784,1047].forEach((f,i) => setTimeout(()=>playTone(f,"sine",0.18,0.2), i*90));
      }

      // ── HUD elements ─────────────────────────────────────
      const hudScore  = document.getElementById("hud-score");
      const hudBest   = document.getElementById("hud-best");
      const pauseBtn  = document.getElementById("pause-btn");
      const soundBtn  = document.getElementById("sound-btn");
      const pauseIcon = document.getElementById("pause-icon");

      const ovStart    = document.getElementById("overlay-start");
      const ovPause    = document.getElementById("overlay-pause");
      const ovGameover = document.getElementById("overlay-gameover");

      function showOverlay(id) {
        [ovStart, ovPause, ovGameover].forEach(o => {
          o.classList.remove("active");
          o.style.display = "";
        });
        const el = document.getElementById(id);
        el.style.display = "flex";
        el.classList.add("active");
      }
      function hideOverlays() {
        [ovStart, ovPause, ovGameover].forEach(o => {
          o.classList.remove("active");
          o.style.display = "none";
        });
      }

      function showHUD(on) {
        hudScore.classList.toggle("visible", on);
        hudBest.classList.toggle("visible",  on);
        pauseBtn.classList.toggle("visible", on);
        soundBtn.classList.toggle("visible", on);
      }

      // ── Reset game ───────────────────────────────────────
      function resetGame() {
        bird  = { y: H/2, vy: 0, angle: 0, flapAnim: 0 };
        pipes = [];
        particles = [];
        score = 0; frame = 0; newBest = false;
        groundX = 0;
        hudScore.textContent = "0";
        document.getElementById("saving-text").textContent = "💾 Saving score…";
        document.getElementById("new-best-badge").classList.remove("show");
      }

      // ── Spawn pipe ───────────────────────────────────────
      function spawnPipe() {
        const minY = 80, maxY = H - GROUND_H - PIPE_GAP - 80;
        const gapY = minY + Math.random() * (maxY - minY);
        pipes.push({ x: PIPE_SPAWN_X, gapY, scored: false });
      }

      // ── Spawn particles ──────────────────────────────────
      function spawnParticles(x, y, color, count = 10) {
        for (let i = 0; i < count; i++) {
          const angle = (Math.PI * 2 * i) / count + Math.random() * 0.5;
          const speed = 2 + Math.random() * 3;
          particles.push({
            x, y,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed - 2,
            life: 1, decay: 0.04 + Math.random() * 0.03,
            r: 3 + Math.random() * 4,
            color,
          });
        }
      }

      // ── Bird collision ───────────────────────────────────
      function birdRect() {
        const r = BIRD_SIZE * 0.38;
        return { cx: BIRD_X, cy: bird.y, r };
      }

      function hitsPipe(pipe) {
        const { cx, cy, r } = birdRect();
        const pL = pipe.x, pR = pipe.x + PIPE_WIDTH;
        const topH = pipe.gapY, botY = pipe.gapY + PIPE_GAP;

        if (cx + r < pL || cx - r > pR) return false;
        if (cy - r < topH) return true;
        if (cy + r > botY) return true;
        return false;
      }

      // ── Flap ─────────────────────────────────────────────
      function flap() {
        if (state === "gameover") return;
        if (state === "paused")   return;

        if (state === "start") {
          startGame();
          return;
        }
        bird.vy       = FLAP_FORCE;
        bird.flapAnim = 1;
        sfxFlap();
        spawnParticles(BIRD_X - 10, bird.y, "rgba(245,200,66,0.8)", 5);
      }

      // ── Start game ───────────────────────────────────────
      function startGame() {
        state = "playing";
        hideOverlays();
        showHUD(true);
        bird.vy = FLAP_FORCE;
        sfxFlap();
      }

      // ── Pause / resume ───────────────────────────────────
      function togglePause() {
        if (state === "playing") {
          state = "paused";
          showOverlay("overlay-pause");
        } else if (state === "paused") {
          state = "playing";
          hideOverlays();
        }
      }

      // ── Game over ────────────────────────────────────────
      async function gameOver() {
        state = "gameover";
        sfxDie();
        spawnParticles(BIRD_X, bird.y, "rgba(255,90,90,0.9)", 18);
        showHUD(false);

        const userBest   = window.getUserBest   ? window.getUserBest()   : 0;
        const userSeason = window.getUserSeason ? window.getUserSeason() : 0;
        newBest = score > userBest;

        document.getElementById("go-score").textContent  = score.toLocaleString();
        document.getElementById("go-best").textContent   = Math.max(score, userBest).toLocaleString();
        document.getElementById("go-season").textContent = Math.max(score, userSeason).toLocaleString();

        if (newBest) {
          document.getElementById("new-best-badge").classList.add("show");
          sfxNewBest();
        }

        showOverlay("overlay-gameover");
        if (window.saveScore) await window.saveScore(score);
      }

      // ── Draw functions ───────────────────────────────────
      function drawSky() {
        const grad = ctx.createLinearGradient(0, 0, 0, H);
        grad.addColorStop(0,   "#0a1628");
        grad.addColorStop(0.5, "#0d2a5c");
        grad.addColorStop(1,   "#1a4a8a");
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, W, H);
      }

      function drawStars() {
        stars.forEach(s => {
          const op = s.op * (0.6 + 0.4 * Math.sin(frame * 0.03 + s.phase));
          ctx.beginPath();
          ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
          ctx.fillStyle = `rgba(255,255,255,${op})`;
          ctx.fill();
        });
      }

      function drawClouds() {
        clouds.forEach(c => {
          if (state === "playing" || state === "gameover") c.x -= c.s;
          if (c.x + c.w < 0) c.x = W + 20;

          ctx.save();
          ctx.globalAlpha = 0.12;
          ctx.fillStyle = "#ffffff";
          ctx.beginPath();
          ctx.ellipse(c.x + c.w/2, c.y, c.w/2, 22, 0, 0, Math.PI*2);
          ctx.ellipse(c.x + c.w*0.3, c.y - 14, c.w*0.22, 18, 0, 0, Math.PI*2);
          ctx.ellipse(c.x + c.w*0.65, c.y - 10, c.w*0.2, 16, 0, 0, Math.PI*2);
          ctx.fill();
          ctx.restore();
        });
      }

      function drawPipe(pipe) {
        const pipeGrad = (x, w, dark, mid, light) => {
          const g = ctx.createLinearGradient(x, 0, x+w, 0);
          g.addColorStop(0,   dark);
          g.addColorStop(0.4, mid);
          g.addColorStop(0.7, light);
          g.addColorStop(1,   dark);
          return g;
        };

        const dark = "#1e5c1e", mid = "#2d8a2d", light = "#4daa4d";
        const capH = 22, capW = PIPE_WIDTH + 14;
        const capX = pipe.x - 7;

        // Top pipe body
        ctx.fillStyle = pipeGrad(pipe.x, PIPE_WIDTH, dark, mid, light);
        ctx.fillRect(pipe.x, 0, PIPE_WIDTH, pipe.gapY - capH);

        // Top pipe cap
        ctx.fillStyle = pipeGrad(capX, capW, "#1a4a1a", "#267326", "#3d9a3d");
        ctx.beginPath();
        ctx.roundRect(capX, pipe.gapY - capH, capW, capH, [0,0,6,6]);
        ctx.fill();

        // Bottom pipe body
        ctx.fillStyle = pipeGrad(pipe.x, PIPE_WIDTH, dark, mid, light);
        ctx.fillRect(pipe.x, pipe.gapY + PIPE_GAP + capH, PIPE_WIDTH, H);

        // Bottom pipe cap
        ctx.fillStyle = pipeGrad(capX, capW, "#1a4a1a", "#267326", "#3d9a3d");
        ctx.beginPath();
        ctx.roundRect(capX, pipe.gapY + PIPE_GAP, capW, capH, [6,6,0,0]);
        ctx.fill();

        // Shine
        ctx.fillStyle = "rgba(255,255,255,0.08)";
        ctx.fillRect(pipe.x + 6, 0, 10, pipe.gapY - capH);
        ctx.fillRect(pipe.x + 6, pipe.gapY + PIPE_GAP + capH, 10, H);
      }

      function drawGround() {
        if (state === "playing") groundX = (groundX - PIPE_SPEED) % 60;

        // Ground fill
        const gGrad = ctx.createLinearGradient(0, H - GROUND_H, 0, H);
        gGrad.addColorStop(0, "#1a5c2a");
        gGrad.addColorStop(1, "#0d3a18");
        ctx.fillStyle = gGrad;
        ctx.fillRect(0, H - GROUND_H, W, GROUND_H);

        // Top line
        ctx.fillStyle = "#2a8a3a";
        ctx.fillRect(0, H - GROUND_H, W, 3);

        // Grass tiles
        for (let gx = groundX; gx < W + 60; gx += 60) {
          ctx.fillStyle = "#2a8a3a";
          ctx.fillRect(gx, H - GROUND_H, 30, 3);
        }
      }

      function drawBird() {
        ctx.save();
        ctx.translate(BIRD_X, bird.y);

        // Tilt
        const tilt = Math.max(-0.5, Math.min(Math.PI/4, bird.vy * 0.065));
        ctx.rotate(tilt);

        // Shadow
        ctx.fillStyle = "rgba(0,0,0,0.15)";
        ctx.beginPath();
        ctx.ellipse(2, BIRD_SIZE/2 - 2, BIRD_SIZE/2 - 2, 6, 0, 0, Math.PI*2);
        ctx.fill();

        const r = BIRD_SIZE / 2;

        // Body
        const bodyGrad = ctx.createRadialGradient(-4, -4, 2, 0, 0, r);
        bodyGrad.addColorStop(0, "#ffe566");
        bodyGrad.addColorStop(0.6, "#f5c842");
        bodyGrad.addColorStop(1, "#c9920a");
        ctx.fillStyle = bodyGrad;
        ctx.beginPath();
        ctx.ellipse(0, 0, r, r * 0.88, 0, 0, Math.PI*2);
        ctx.fill();

        // Wing (animated)
        const wingY = Math.sin(frame * 0.4) * 4;
        ctx.fillStyle = "#e6a800";
        ctx.beginPath();
        ctx.ellipse(-6, wingY + 3, 10, 6, -0.4, 0, Math.PI*2);
        ctx.fill();

        // Eye white
        ctx.fillStyle = "#ffffff";
        ctx.beginPath();
        ctx.arc(r * 0.35, -r * 0.22, 7, 0, Math.PI*2);
        ctx.fill();

        // Pupil
        ctx.fillStyle = "#1a0a00";
        ctx.beginPath();
        ctx.arc(r * 0.42, -r * 0.22, 4, 0, Math.PI*2);
        ctx.fill();

        // Eye shine
        ctx.fillStyle = "rgba(255,255,255,0.9)";
        ctx.beginPath();
        ctx.arc(r * 0.48, -r * 0.3, 1.5, 0, Math.PI*2);
        ctx.fill();

        // Beak
        ctx.fillStyle = "#ff8c00";
        ctx.beginPath();
        ctx.moveTo(r * 0.75, -2);
        ctx.lineTo(r * 1.35, 1);
        ctx.lineTo(r * 0.75, 5);
        ctx.closePath();
        ctx.fill();

        ctx.restore();

        // Flap trail
        bird.flapAnim = Math.max(0, bird.flapAnim - 0.08);
      }

      function drawParticles() {
        particles.forEach(p => {
          ctx.save();
          ctx.globalAlpha = p.life;
          ctx.fillStyle   = p.color;
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.r * p.life, 0, Math.PI*2);
          ctx.fill();
          ctx.restore();
        });
      }

      function drawScorePopup() {
        // Handled via HUD
      }

      // ── Score pop animation ──────────────────────────────
      let scorePopAlpha = 0, scorePopY = 0;
      function triggerScorePop() {
        scorePopAlpha = 1;
        scorePopY = bird.y - 40;
      }
      function drawScorePop() {
        if (scorePopAlpha <= 0) return;
        ctx.save();
        ctx.globalAlpha = scorePopAlpha;
        ctx.fillStyle   = "#f5c842";
        ctx.font        = `bold 22px 'Fredoka One', cursive`;
        ctx.textAlign   = "center";
        ctx.fillText(`+1`, BIRD_X + 30, scorePopY);
        ctx.restore();
        scorePopAlpha -= 0.04;
        scorePopY     -= 1.2;
      }

      // ── Update ───────────────────────────────────────────
      function update() {
        if (state !== "playing") return;
        frame++;

        // Bird physics
        bird.vy += GRAVITY;
        bird.y  += bird.vy;

        // Ground / ceiling
        if (bird.y + BIRD_SIZE/2 >= H - GROUND_H) {
          bird.y = H - GROUND_H - BIRD_SIZE/2;
          gameOver(); return;
        }
        if (bird.y - BIRD_SIZE/2 <= 0) {
          bird.y = BIRD_SIZE/2;
          bird.vy = 0;
        }

        // Spawn pipes
        if (frame % PIPE_INTERVAL === 0) spawnPipe();

        // Move pipes + score
        for (let i = pipes.length - 1; i >= 0; i--) {
          pipes[i].x -= PIPE_SPEED;
          if (pipes[i].x + PIPE_WIDTH < 0) { pipes.splice(i,1); continue; }

          // Score point
          if (!pipes[i].scored && pipes[i].x + PIPE_WIDTH < BIRD_X - BIRD_SIZE/2) {
            pipes[i].scored = true;
            score++;
            hudScore.textContent = score;
            sfxScore();
            triggerScorePop();
            spawnParticles(BIRD_X + 20, bird.y, "rgba(245,200,66,0.7)", 6);
          }

          // Collision
          if (hitsPipe(pipes[i])) { gameOver(); return; }
        }

        // Particles
        particles.forEach(p => {
          p.x   += p.vx; p.y += p.vy;
          p.vy  += 0.15;
          p.life -= p.decay;
        });
        particles = particles.filter(p => p.life > 0);

        // Speed up over time (subtle)
        // PIPE_SPEED is a const — we keep it simple
      }

      // ── Draw frame ───────────────────────────────────────
      function draw() {
        ctx.clearRect(0, 0, W, H);
        drawSky();
        drawStars();
        drawClouds();
        pipes.forEach(drawPipe);
        drawGround();
        drawBird();
        drawParticles();
        drawScorePop();
      }

      // ── Game loop ────────────────────────────────────────
      function loop() {
        update();
        draw();
        animId = requestAnimationFrame(loop);
      }
      loop();

      // ── Input handlers ───────────────────────────────────
      document.addEventListener("keydown", (e) => {
        if (e.code === "Space" || e.code === "ArrowUp") {
          e.preventDefault();
          if (state === "paused") return;
          flap();
        }
        if (e.code === "Escape" || e.code === "KeyP") {
          if (state === "playing" || state === "paused") togglePause();
        }
      });

      canvas.addEventListener("pointerdown", (e) => {
        e.preventDefault();
        if (state === "gameover" || state === "paused") return;
        flap();
      });

      document.getElementById("start-btn").addEventListener("click", (e) => {
        e.stopPropagation();
        startGame();
      });

      document.getElementById("resume-btn").addEventListener("click", (e) => {
        e.stopPropagation();
        togglePause();
      });

      pauseBtn.addEventListener("click", (e) => {
        e.stopPropagation();
        if (state === "playing" || state === "paused") togglePause();
      });

      document.getElementById("retry-btn").addEventListener("click", (e) => {
        e.stopPropagation();
        resetGame();
        startGame();
      });

      // Pause icon toggle
      const origPauseHTML = pauseIcon.innerHTML;
      const playHTML = `<polygon points="5 3 19 12 5 21 5 3"/>`;
      document.addEventListener("statechange", () => {});
      setInterval(() => {
        pauseIcon.innerHTML = state === "paused" ? playHTML : origPauseHTML;
      }, 200);

      // Sound toggle
      const soundWaves = document.getElementById("sound-waves");
      soundBtn.addEventListener("click", (e) => {
        e.stopPropagation();
        soundOn = !soundOn;
        soundWaves.style.display = soundOn ? "" : "none";
        soundBtn.style.opacity   = soundOn ? "1" : "0.45";
      });

      // Show start overlay
      showOverlay("overlay-start");

    } // end initGame
  </script>

</body>
</html>

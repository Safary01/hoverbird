<!DOCTYPE html>
<html>
<head>
  <title>HoverBird</title>
  <link rel="stylesheet" href="styles.css">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
  body {
    margin: 0;
    overflow: auto;
    text-align: center;
    font-family: Arial, sans-serif;
    background: #87CEEB;
  }

  h2 { margin: 10px; }

  canvas {
    display: block;
    margin: auto;
    width: 100%;
    max-width: 360px;
    background: #87CEEB;
    border: 2px solid #333;
  }

  #ui {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    display: none;
    justify-content: center;
    align-items: center;
    background: rgba(0,0,0,0.7);
    z-index: 1000;
  }

  #ui .panel {
    background: white;
    padding: 20px;
    border-radius: 12px;
    text-align: center;
    width: 90%;
    max-width: 300px;
  }

  button {
    padding: 12px 20px;
    margin: 6px;
    font-size: 16px;
    cursor: pointer;
    border: none;
    border-radius: 6px;
  }

  #soundToggle {
    position: absolute;
    top: 10px;
    right: 10px;
    z-index: 2000;
  }

  #pauseToggle {
    position: absolute;
    top: 10px;
    right: 70px;
    z-index: 2000;
  }
</style>
</head>

<body>

<h2>HoverBird</h2>

<button id="soundToggle">🔊</button>
<button id="pauseToggle">⏸️</button>

<canvas id="gameCanvas" width="360" height="640"></canvas>
<div id="ui"></div>

<script type="module">

import { auth, db } from "./js/firebase-config.js";
import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-auth.js";
import { doc, getDoc, updateDoc, setDoc } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-firestore.js";

const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");
const ui = document.getElementById("ui");

// ---------------- STATE ----------------
let soundEnabled = localStorage.getItem("soundEnabled") !== "false";
let gameStarted = false;
let gameOver = false;
let gamePaused = false;

let score = 0;
let bestScore = 0;
let pipeTimer = null;

// ---------------- UI ----------------
const soundToggle = document.getElementById("soundToggle");
const pauseToggle = document.getElementById("pauseToggle");

function updateUI() {
  soundToggle.textContent = soundEnabled ? "🔊" : "🔇";
  pauseToggle.textContent = gamePaused ? "▶️" : "⏸️";
}
updateUI();

// ---------------- SOUND ----------------
const scoreSound = new Audio("assets/sounds/score.mp3");
const gameOverSound = new Audio("assets/sounds/game-over.mp3");
const bestScoreSound = new Audio("assets/sounds/best-score.mp3");

function playSound(sound) {
  if (!soundEnabled) return;
  sound.currentTime = 0;
  sound.play().catch(() => {});
}

function playScore() {
  if (!soundEnabled) return;
  const s = new Audio(scoreSound.src);
  s.play().catch(() => {});
}

// ---------------- BIRD ----------------
const birdImage = new Image();
birdImage.src = "assets/images/bird.png";

const bird = {
  x: 120,
  y: 320,
  velocity: 0,
  gravity: 0.5,
  flapPower: -8,
  width: 40,
  height: 40
};

// ---------------- GAME OBJECTS ----------------
const clouds = [
  { x: 50, y: 80, speed: 0.3 },
  { x: 220, y: 150, speed: 0.2 },
  { x: 120, y: 250, speed: 0.4 },
  { x: 300, y: 120, speed: 0.25 }
];

const pipes = [];
const PIPE_WIDTH = 60;
const PIPE_GAP = 200;
const PIPE_SPEED = 1.5;
const GROUND_HEIGHT = 60;

// ---------------- AUTH ----------------
onAuthStateChanged(auth, async (user) => {
  if (!user) return (window.location.href = "login.html");

  const ref = doc(db, "users", user.uid);
  const snap = await getDoc(ref);

  if (!snap.exists()) {
    await setDoc(ref, {
      bestScore: 0,
      season: getSeason(),
      seasonScore: 0
    });
  } else {
    bestScore = snap.data().bestScore || 0;
  }
});

// ---------------- SEASON ----------------
function getSeason() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}`;
}

// ---------------- GAME ----------------
function startGame() {
  if (gameStarted) return;

  gameStarted = true;
  ui.style.display = "none";

  pipeTimer = setInterval(() => {
    if (!gameOver && !gamePaused) createPipe();
  }, 2500);
}

// ---------------- FLAP ----------------
function flap() {
  if (gameOver || gamePaused) return;

  if (!gameStarted) startGame();

  bird.velocity = bird.flapPower;
}

// ---------------- PIPE ----------------
function createPipe() {
  pipes.push({
    x: canvas.width,
    topHeight: Math.random() * 250 + 80,
    passed: false
  });
}

// ---------------- INPUT ----------------
canvas.addEventListener("click", flap);
canvas.addEventListener("touchstart", e => {
  e.preventDefault();
  flap();
});

// ---------------- PAUSE ----------------
pauseToggle.onclick = () => {
  if (!gameStarted || gameOver) return;

  gamePaused = !gamePaused;
  updateUI();

  ui.style.display = gamePaused ? "flex" : "none";
  if (gamePaused) {
    ui.innerHTML = `
      <div class="panel">
        <h2>Paused</h2>
        <button onclick="resumeGame()">Resume</button>
      </div>`;
  }
};

window.resumeGame = () => {
  gamePaused = false;
  updateUI();
  ui.style.display = "none";
};

// ---------------- END GAME ----------------
async function endGame() {
  if (gameOver) return;

  gameOver = true;
  playSound(gameOverSound);
  clearInterval(pipeTimer);

  const user = auth.currentUser;
  const season = getSeason();

  if (user) {
    const ref = doc(db, "users", user.uid);
    const snap = await getDoc(ref);
    const data = snap.data();

    let updates = {};

    // best score
    if (score > (data.bestScore || 0)) {
      updates.bestScore = score;
    }

    // season logic
    if (!data.season || data.season !== season) {
      updates.season = season;
      updates.seasonScore = score;
    } else if (score > (data.seasonScore || 0)) {
      updates.seasonScore = score;
    }

    await updateDoc(ref, updates);

    if (updates.bestScore) playSound(bestScoreSound);
  }

  ui.style.display = "flex";
  ui.innerHTML = `
    <div class="panel">
      <h2>Game Over</h2>
      <p>Score: ${score}</p>
      <button onclick="restartGame()">Play Again</button>
    </div>`;
}

// ---------------- UPDATE ----------------
function update() {
  if (!gameStarted || gameOver || gamePaused) return;

  bird.velocity += bird.gravity;
  bird.y += bird.velocity;

  for (let i = pipes.length - 1; i >= 0; i--) {
    const p = pipes[i];
    p.x -= PIPE_SPEED;

    if (!p.passed && p.x + PIPE_WIDTH < bird.x) {
      p.passed = true;
      score++;
      playScore();
    }

    const hit =
      bird.x < p.x + PIPE_WIDTH &&
      bird.x + bird.width > p.x &&
      (bird.y < p.topHeight ||
        bird.y + bird.height > p.topHeight + PIPE_GAP);

    if (hit) endGame();
  }

  if (bird.y > canvas.height - GROUND_HEIGHT) endGame();
}

// ---------------- DRAW ----------------
function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  ctx.font = "16px Arial";

  clouds.forEach(c => {
    c.x -= c.speed;
    if (c.x < -50) c.x = canvas.width + 50;

    ctx.fillStyle = "white";
    ctx.beginPath();
    ctx.arc(c.x, c.y, 18, 0, Math.PI * 2);
    ctx.fill();
  });

  ctx.fillStyle = "green";
  pipes.forEach(p => {
    ctx.fillRect(p.x, 0, PIPE_WIDTH, p.topHeight);
    ctx.fillRect(p.x, p.topHeight + PIPE_GAP, PIPE_WIDTH, canvas.height);
  });

  ctx.drawImage(birdImage, bird.x, bird.y, bird.width, bird.height);

  ctx.fillStyle = "#c2b280";
  ctx.fillRect(0, canvas.height - GROUND_HEIGHT, canvas.width, GROUND_HEIGHT);

  ctx.fillStyle = "black";
  ctx.fillText("Score: " + score, 10, 20);
}

// ---------------- LOOP ----------------
function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}

birdImage.onload = loop;

// ---------------- GLOBALS ----------------
window.restartGame = () => location.reload();

soundToggle.onclick = () => {
  soundEnabled = !soundEnabled;
  localStorage.setItem("soundEnabled", soundEnabled);
  updateUI();
};

updateUI();

</script>

</body>
</html>

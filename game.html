<!DOCTYPE html>
<html>
<head>
  <title>HoverBird</title>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
  body {
    margin: 0;
    overflow: auto;
    text-align: center;
    font-family: Arial, sans-serif;
    background: #87CEEB;
  }

  h2 {
    margin: 10px;
  }

  canvas {
    display: block;
    margin: auto;
    width: 100%;
    max-width: 360px;
    background: #87CEEB;
    border: 2px solid #333;
  }

  /* Game Over Overlay */
  #ui {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    display: none;
    justify-content: center;
    align-items: center;
    background: rgba(0, 0, 0, 0.7);
    z-index: 1000;
  }

  /* Popup Panel */
  #ui .panel {
    background: white;
    padding: 20px;
    border-radius: 12px;
    text-align: center;
    width: 90%;
    max-width: 300px;
    box-sizing: border-box;
  }

  #ui h2 {
    margin-top: 0;
  }

  #ui p {
    font-size: 18px;
    margin: 15px 0;
  }

  button {
    padding: 12px 20px;
    margin: 6px;
    font-size: 16px;
    cursor: pointer;
    border: none;
    border-radius: 6px;
  }

  button:hover {
    opacity: 0.9;
  }
</style>
</head>

<body>

<h2>HoverBird</h2>

<canvas id="gameCanvas" width="360" height="640"></canvas>

<div id="ui"></div>

<script type="module">
import { auth, db } from "./js/firebase-config.js";

import {
  onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/12.14.0/firebase-auth.js";

import {
  doc,
  getDoc,
  updateDoc
} from "https://www.gstatic.com/firebasejs/12.14.0/firebase-firestore.js";  

const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");
const ui = document.getElementById("ui");

// Game state
let gameStarted = false;
let gameOver = false;
let score = 0;
let pipeTimer = null;
let currentUser = null;
let bestScore = 0;

// Bird image
const birdImage = new Image();
birdImage.src = "assets/images/bird.png";

// Bird
const bird = {
  x: 120,
  y: 320,
  velocity: 0,
  gravity: 0.5,
  flapPower: -8,
  width: 40,
  height: 40
};

// Pipes
const pipes = [];

const PIPE_WIDTH = 60;
const PIPE_GAP = 220;
const PIPE_SPEED = 2;
const GROUND_HEIGHT = 60;

// ---------------- START GAME ----------------

  onAuthStateChanged(auth, async (user) => {

  if (!user) {
    window.location.href = "login.html";
    return;
  }

  currentUser = user;

  const userRef = doc(db, "users", user.uid);
  const userSnap = await getDoc(userRef);

  if (userSnap.exists()) {
    bestScore = userSnap.data().bestScore || 0;
  }

});
function startGame() {

  if (gameStarted) return;

  gameStarted = true;

  ui.style.display = "none";
  ui.innerHTML = "";

  pipeTimer = setInterval(() => {

    if (gameOver) return;

    createPipe();

  }, 3000);
}

// ---------------- FLAP ----------------

function flap() {

  if (gameOver) return;

  if (!gameStarted) {
    startGame();
  }

  bird.velocity = bird.flapPower;
}

// ---------------- CREATE PIPE ----------------

function createPipe() {

  const minTopHeight = 80;
  const maxTopHeight = 350;

  const topHeight =
    Math.random() * (maxTopHeight - minTopHeight) +
    minTopHeight;

  pipes.push({
    x: canvas.width,
    topHeight,
    passed: false
  });
}

// ---------------- INPUT ----------------

canvas.addEventListener("click", flap);

canvas.addEventListener("touchstart", (e) => {
  e.preventDefault();
  flap();
});

// ---------------- END GAME ----------------

import { auth, db } from "./js/firebase-config.js";
import {
  doc,
  getDoc,
  setDoc,
  updateDoc
} from "https://www.gstatic.com/firebasejs/12.14.0/firebase-firestore.js";

function getCurrentSeason() {
  const now = new Date();
  const year = now.getFullYear();
  const month = String(now.getMonth() + 1).padStart(2, "0");
  return `${year}-${month}`;
}

async function endGame() {

  if (gameOver) return;

  gameOver = true;

  if (pipeTimer) clearInterval(pipeTimer);

  const user = auth.currentUser;
  const season = getCurrentSeason();

  let isNewBest = false;

  if (user) {

    const ref = doc(db, "users", user.uid);
    const snap = await getDoc(ref);

    if (snap.exists()) {

      const data = snap.data();

      // Reset season if new month
      if (data.season !== season) {
        await updateDoc(ref, {
          season,
          seasonScore: score
        });
      } else {

        const currentSeasonScore = data.seasonScore || 0;

        if (score > currentSeasonScore) {
          await updateDoc(ref, {
            seasonScore: score
          });
        }
      }

      if (score > (data.bestScore || 0)) {
        await updateDoc(ref, {
          bestScore: score
        });
        isNewBest = true;
      }

    } else {

      await setDoc(ref, {
        username: "Player",
        season,
        seasonScore: score,
        bestScore: score,
        createdAt: Date.now()
      });
    }
  }

  ui.style.display = "flex";

  ui.innerHTML = `
    <div class="panel">
      <h2>Game Over</h2>
      <p>Score: ${score}</p>
      <p>Season: ${season}</p>
      ${isNewBest ? "<p>🎉 New Best Score!</p>" : ""}
      <button onclick="restartGame()">Play Again</button>
      <button onclick="goDashboard()">Dashboard</button>
    </div>
  `;
}
// ---------------- UPDATE ----------------

function update() {

  if (!gameStarted || gameOver) return;

  bird.velocity += bird.gravity;
  bird.y += bird.velocity;

  for (let i = pipes.length - 1; i >= 0; i--) {

    const pipe = pipes[i];

    pipe.x -= PIPE_SPEED;

    // Score
    if (!pipe.passed && pipe.x + PIPE_WIDTH < bird.x) {
      pipe.passed = true;
      score++;
    }

    // Remove pipe
    if (pipe.x + PIPE_WIDTH < 0) {
      pipes.splice(i, 1);
      continue;
    }

    // Collision
    const birdLeft = bird.x;
    const birdRight = bird.x + bird.width;
    const birdTop = bird.y;
    const birdBottom = bird.y + bird.height;

    const pipeLeft = pipe.x;
    const pipeRight = pipe.x + PIPE_WIDTH;

    const collision =
      birdRight > pipeLeft &&
      birdLeft < pipeRight &&
      (
        birdTop < pipe.topHeight ||
        birdBottom > pipe.topHeight + PIPE_GAP
      );

    if (collision) {
      endGame();
      return;
    }
  }

  // Ceiling
  if (bird.y < 0) {
    bird.y = 0;
    bird.velocity = 0;
  }

  // Ground
  if (
    bird.y >
    canvas.height - GROUND_HEIGHT - bird.height
  ) {
    endGame();
  }
}

// ---------------- DRAW ----------------

function draw() {

  ctx.clearRect(
    0,
    0,
    canvas.width,
    canvas.height
  );

  // Pipes
  ctx.fillStyle = "green";

  for (const pipe of pipes) {

    ctx.fillRect(
      pipe.x,
      0,
      PIPE_WIDTH,
      pipe.topHeight
    );

    ctx.fillRect(
      pipe.x,
      pipe.topHeight + PIPE_GAP,
      PIPE_WIDTH,
      canvas.height
    );
  }

  // Bird
  if (birdImage.complete) {

    ctx.drawImage(
      birdImage,
      bird.x,
      bird.y,
      bird.width,
      bird.height
    );

  }

  // Ground
  ctx.fillStyle = "#c2b280";

  ctx.fillRect(
    0,
    canvas.height - GROUND_HEIGHT,
    canvas.width,
    GROUND_HEIGHT
  );

  // Score
  ctx.fillStyle = "black";
  ctx.font = "20px Arial";
  ctx.fillText(
    "Score: " + score,
    10,
    30
  );

  // Start Screen
  if (!gameStarted) {

    ctx.fillStyle =
      "rgba(0,0,0,0.5)";

    ctx.fillRect(
      0,
      0,
      canvas.width,
      canvas.height
    );

    ctx.fillStyle = "white";
    ctx.font = "30px Arial";
    ctx.fillText(
      "HoverBird",
      100,
      250
    );

    ctx.font = "20px Arial";
    ctx.fillText(
      "Tap to Start",
      120,
      300
    );
  }
}

// ---------------- LOOP ----------------

function gameLoop() {

  update();
  draw();

  requestAnimationFrame(gameLoop);
}

// ---------------- BUTTONS ----------------

window.restartGame = function () {
  location.reload();
};

window.goDashboard = function () {
  window.location.href = "dashboard.html";
};

// ---------------- START ----------------

birdImage.onload = () => {
  gameLoop();
};

    </script>

</body>
</html>

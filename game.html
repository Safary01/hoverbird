<!DOCTYPE html>
<html>
<head>
  <title>HoverBird</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      margin: 0;
      overflow: hidden;
      text-align: center;
      font-family: Arial, sans-serif;
      background: #87CEEB;
    }

   canvas {
  display: block;
  margin: auto;
  width: 100%;
  max-width: 360px;
  height: auto;
  background: #87CEEB;
  border: 2px solid #333;
}

    h2 {
      margin: 10px;
    }
  </style>
</head>
<body>

<h2>HoverBird</h2>

<canvas id="gameCanvas" width="360" height="640"></canvas>

<script>

const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");

// Bird image
const birdImage = new Image();
birdImage.src = "assets/images/bird.png";

// Bird
const bird = {
  x: 120,
  y: 320,
  velocity: 0,
  gravity: 0.5,
  flapPower: -8,
  width: 40,
  height: 40
};

// Pipes
const pipes = [];

const PIPE_WIDTH = 60;
const PIPE_GAP = 220;
const PIPE_SPEED = 2;

const GROUND_HEIGHT = 60;

let gameOver = false;

// Flap
function flap() {

  if (gameOver) return;

  bird.velocity = bird.flapPower;
}

// Create Pipe
function createPipe() {

  if (gameOver) return;

  const minTopHeight = 80;
  const maxTopHeight = 350;

  const topHeight =
    Math.random() * (maxTopHeight - minTopHeight) +
    minTopHeight;

  pipes.push({
    x: canvas.width,
    topHeight: topHeight
  });
}

// Desktop click
canvas.addEventListener("click", flap);

// Mobile touch
canvas.addEventListener("touchstart", (e) => {
  e.preventDefault();
  flap();
});

// Update physics
function update() {

  if (gameOver) return;

  bird.velocity += bird.gravity;
  bird.y += bird.velocity;

  // Move pipes
  for (let i = pipes.length - 1; i >= 0; i--) {

    const pipe = pipes[i];

    pipe.x -= PIPE_SPEED;

    // Remove off-screen pipes
    if (pipe.x + PIPE_WIDTH < 0) {
      pipes.splice(i, 1);
      continue;
    }

    // Collision detection
    const birdLeft = bird.x;
    const birdRight = bird.x + bird.width;
    const birdTop = bird.y;
    const birdBottom = bird.y + bird.height;

    const pipeLeft = pipe.x;
    const pipeRight = pipe.x + PIPE_WIDTH;

    const collision =
      birdRight > pipeLeft &&
      birdLeft < pipeRight &&
      (
        birdTop < pipe.topHeight ||
        birdBottom > pipe.topHeight + PIPE_GAP
      );

    if (collision) {
      gameOver = true;
    }
  }

  // Ceiling collision
  if (bird.y < 0) {
    bird.y = 0;
    bird.velocity = 0;
  }

  // Ground collision
  if (bird.y > canvas.height - GROUND_HEIGHT - bird.height) {

    bird.y = canvas.height - GROUND_HEIGHT - bird.height;
    bird.velocity = 0;

    gameOver = true;
  }
}

// Draw game
function draw() {

  ctx.clearRect(0, 0, canvas.width, canvas.height);

  // Pipes
  ctx.fillStyle = "green";

  for (const pipe of pipes) {

    // Top pipe
    ctx.fillRect(
      pipe.x,
      0,
      PIPE_WIDTH,
      pipe.topHeight
    );

    // Bottom pipe
    ctx.fillRect(
      pipe.x,
      pipe.topHeight + PIPE_GAP,
      PIPE_WIDTH,
      canvas.height
    );
  }

  // Bird
  if (birdImage.complete) {
    ctx.drawImage(
      birdImage,
      bird.x,
      bird.y,
      bird.width,
      bird.height
    );
  }

  // Ground
  ctx.fillStyle = "#c2b280";

  ctx.fillRect(
    0,
    canvas.height - GROUND_HEIGHT,
    canvas.width,
    GROUND_HEIGHT
  );

  // Game Over Overlay
  if (gameOver) {

    ctx.fillStyle = "rgba(0,0,0,0.7)";
    ctx.fillRect(
      0,
      0,
      canvas.width,
      canvas.height
    );

    ctx.fillStyle = "white";
    ctx.font = "40px Arial";
    ctx.fillText("Game Over", 70, 250);

    ctx.font = "20px Arial";
    ctx.fillText(
      "Refresh to play again",
      85,
      300
    );
  }
}

// Game loop
function gameLoop() {

  update();
  draw();

  requestAnimationFrame(gameLoop);
}

// Create pipes every 3 seconds
setInterval(createPipe, 3000);

// Start game
birdImage.onload = () => {
  gameLoop();
};

</script>

</body>
</html>

<!DOCTYPE html>
<html>
<head>
  <title>HoverBird</title>

  <style>
    body {
      margin: 0;
      overflow: hidden;
      text-align: center;
      font-family: Arial, sans-serif;
      background: #87CEEB;
    }

    canvas {
      display: block;
      margin: auto;
      background: #87CEEB;
      border: 2px solid #333;
    }

    h2 {
      margin: 10px;
    }
  </style>
</head>
<body>

<h2>HoverBird</h2>

<canvas id="gameCanvas" width="360" height="640"></canvas>

<script>

const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");

// Bird image
const birdImage = new Image();
birdImage.src = "assets/images/bird.png";

// Bird
const bird = {
  x: 120,
  y: 320,
  velocity: 0,
  gravity: 0.5,
  flapPower: -8,
  width: 40,
  height: 40
};
  const pipes = [];

const PIPE_WIDTH = 60;
const PIPE_GAP = 180;
const PIPE_SPEED = 2;

// Flap
function flap() {
  bird.velocity = bird.flapPower;
}
  function createPipe() {

  const minTopHeight = 80;
  const maxTopHeight = 350;

  const topHeight =
    Math.random() * (maxTopHeight - minTopHeight) +
    minTopHeight;

  pipes.push({
    x: canvas.width,
    topHeight: topHeight
  });

}

// Desktop click
canvas.addEventListener("click", flap);

// Mobile touch
canvas.addEventListener("touchstart", (e) => {
  e.preventDefault();
  flap();
});

// Update physics
function update() {

  bird.velocity += bird.gravity;
  bird.y += bird.velocity;
  for (let i = pipes.length - 1; i >= 0; i--) {

  pipes[i].x -= PIPE_SPEED;

  if (pipes[i].x + PIPE_WIDTH < 0) {
    pipes.splice(i, 1);
  }

}

  // Prevent bird from leaving top
  if (bird.y < 0) {
    bird.y = 0;
    bird.velocity = 0;
  }

  // Prevent bird from falling through bottom
  if (bird.y > canvas.height - bird.height) {
    bird.y = canvas.height - bird.height;
    bird.velocity = 0;
  }
}

// Draw game
function draw() {

  ctx.clearRect(0, 0, canvas.width, canvas.height);

  // Draw bird image
  if (birdImage.complete) {
    ctx.drawImage(
      birdImage,
      bird.x,
      bird.y,
      bird.width,
      bird.height
    );
    ctx.fillStyle = "green";

for (const pipe of pipes) {

  // Top pipe
  ctx.fillRect(
    pipe.x,
    0,
    PIPE_WIDTH,
    pipe.topHeight
  );

  // Bottom pipe
  ctx.fillRect(
    pipe.x,
    pipe.topHeight + PIPE_GAP,
    PIPE_WIDTH,
    canvas.height
  );

}
  }
}

// Game loop
function gameLoop() {

  update();
  draw();

  requestAnimationFrame(gameLoop);
}

// Start game after image loads
setInterval(createPipe, 3000);
birdImage.onload = () => {
  gameLoop();
};

</script>

</body>
</html>

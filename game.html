<!DOCTYPE html>
<html>
<head>
  <title>HoverBird</title>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      margin: 0;
      overflow: hidden;
      text-align: center;
      font-family: Arial, sans-serif;
      background: #87CEEB;
    }

    canvas {
      display: block;
      margin: auto;
      width: 100%;
      max-width: 360px;
      background: #87CEEB;
      border: 2px solid #333;
    }

    h2 {
      margin: 10px;
    }

    #ui {
      text-align: center;
      margin-top: 10px;
    }

    button {
      padding: 10px 20px;
      margin: 5px;
      font-size: 16px;
    }
  </style>
</head>

<body>

<h2>HoverBird</h2>

<canvas id="gameCanvas" width="360" height="640"></canvas>

<div id="ui"></div>

<script>

const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");
const ui = document.getElementById("ui");

// Game states
let gameStarted = false;
let gameOver = false;
let score = 0;

// Bird image
const birdImage = new Image();
birdImage.src = "assets/images/bird.png";

// Bird
const bird = {
  x: 120,
  y: 320,
  velocity: 0,
  gravity: 0.5,
  flapPower: -8,
  width: 40,
  height: 40
};

// Pipes
const pipes = [];

const PIPE_WIDTH = 60;
const PIPE_GAP = 220;
const PIPE_SPEED = 2;
const GROUND_HEIGHT = 60;

// ---------------- START GAME ----------------

function startGame() {

  if (gameStarted) return;

  gameStarted = true;
  ui.innerHTML = "";

  setInterval(() => {
    if (!gameStarted || gameOver) return;
    createPipe();
  }, 3000);
}

// ---------------- FLAP ----------------

function flap() {

  if (gameOver) return;

  if (!gameStarted) {
    startGame();
  }

  bird.velocity = bird.flapPower;
}

// ---------------- PIPE ----------------

function createPipe() {

  const minTopHeight = 80;
  const maxTopHeight = 350;

  const topHeight =
    Math.random() * (maxTopHeight - minTopHeight) +
    minTopHeight;

  pipes.push({
    x: canvas.width,
    topHeight: topHeight,
    passed: false
  });
}

// ---------------- INPUT ----------------

canvas.addEventListener("click", flap);

canvas.addEventListener("touchstart", (e) => {
  e.preventDefault();
  flap();
});

// ---------------- UPDATE ----------------

function update() {

  if (!gameStarted || gameOver) return;

  bird.velocity += bird.gravity;
  bird.y += bird.velocity;

  for (let i = pipes.length - 1; i >= 0; i--) {

    const pipe = pipes[i];

    pipe.x -= PIPE_SPEED;

    // score system
    if (!pipe.passed && pipe.x + PIPE_WIDTH < bird.x) {
      score++;
      pipe.passed = true;
    }

    if (pipe.x + PIPE_WIDTH < 0) {
      pipes.splice(i, 1);
      continue;
    }

    const birdLeft = bird.x;
    const birdRight = bird.x + bird.width;
    const birdTop = bird.y;
    const birdBottom = bird.y + bird.height;

    const pipeLeft = pipe.x;
    const pipeRight = pipe.x + PIPE_WIDTH;

    const collision =
      birdRight > pipeLeft &&
      birdLeft < pipeRight &&
      (
        birdTop < pipe.topHeight ||
        birdBottom > pipe.topHeight + PIPE_GAP
      );

    if (collision) {
      endGame();
    }
  }

  if (bird.y > canvas.height - GROUND_HEIGHT - bird.height) {
    endGame();
  }
}

// ---------------- GAME OVER ----------------

function endGame() {

  gameOver = true;

  ui.innerHTML = `
    <h3>Game Over</h3>
    <p>Score: ${score}</p>
    <button onclick="restartGame()">Play Again</button>
    <button onclick="goDashboard()">Dashboard</button>
  `;
}

// ---------------- RESTART ----------------

window.restartGame = function () {
  location.reload();
};

// ---------------- DASHBOARD ----------------

window.goDashboard = function () {
  window.location.href = "dashboard.html";
};

// ---------------- DRAW ----------------

function draw() {

  ctx.clearRect(0, 0, canvas.width, canvas.height);

  // Pipes
  ctx.fillStyle = "green";

  for (const pipe of pipes) {

    ctx.fillRect(pipe.x, 0, PIPE_WIDTH, pipe.topHeight);

    ctx.fillRect(
      pipe.x,
      pipe.topHeight + PIPE_GAP,
      PIPE_WIDTH,
      canvas.height
    );
  }

  // Bird
  if (birdImage.complete) {
    ctx.drawImage(
      birdImage,
      bird.x,
      bird.y,
      bird.width,
      bird.height
    );
  }

  // Ground
  ctx.fillStyle = "#c2b280";

  ctx.fillRect(
    0,
    canvas.height - GROUND_HEIGHT,
    canvas.width,
    GROUND_HEIGHT
  );

  // Score display
  ctx.fillStyle = "black";
  ctx.font = "20px Arial";
  ctx.fillText("Score: " + score, 10, 30);

  // Start screen
  if (!gameStarted && !gameOver) {
    ctx.fillStyle = "rgba(0,0,0,0.5)";
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    ctx.fillStyle = "white";
    ctx.font = "30px Arial";
    ctx.fillText("HoverBird", 100, 250);

    ctx.font = "20px Arial";
    ctx.fillText("Tap to Start", 120, 300);
  }
}

// ---------------- LOOP ----------------

function gameLoop() {
  update();
  draw();
  requestAnimationFrame(gameLoop);
}

birdImage.onload = () => {
  gameLoop();
};

</script>

</body>
</html>

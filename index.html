<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HoverBird — Compete. Fly. Dominate.</title>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet" />

  <style>
    /* ── Reset & Base ───────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --sky-top:    #0a1628;
      --sky-mid:    #0d2a5c;
      --sky-low:    #1a4a8a;
      --gold:       #f5c842;
      --gold-dark:  #c9920a;
      --teal:       #00d4aa;
      --teal-dark:  #009977;
      --white:      #ffffff;
      --text-soft:  rgba(255,255,255,0.75);
      --card-bg:    rgba(255,255,255,0.06);
      --card-border:rgba(255,255,255,0.12);
    }

    html, body {
      height: 100%;
      font-family: 'Nunito', sans-serif;
      background: var(--sky-top);
      color: var(--white);
      overflow-x: hidden;
    }

    /* ── Animated Sky Background ───────────────────────────── */
    .sky {
      position: fixed;
      inset: 0;
      background: linear-gradient(180deg,
        var(--sky-top) 0%,
        var(--sky-mid) 45%,
        var(--sky-low) 100%
      );
      z-index: 0;
    }

    /* Stars */
    .stars {
      position: fixed;
      inset: 0;
      z-index: 1;
      pointer-events: none;
    }
    .star {
      position: absolute;
      background: #fff;
      border-radius: 50%;
      animation: twinkle var(--d, 3s) ease-in-out infinite var(--delay, 0s);
      opacity: 0;
    }
    @keyframes twinkle {
      0%, 100% { opacity: 0; }
      50%       { opacity: var(--op, 0.8); }
    }

    /* Clouds */
    .clouds {
      position: fixed;
      inset: 0;
      z-index: 2;
      pointer-events: none;
      overflow: hidden;
    }
    .cloud {
      position: absolute;
      background: rgba(255,255,255,0.07);
      border-radius: 50px;
      animation: drift var(--spd, 60s) linear infinite;
      filter: blur(1px);
    }
    .cloud::before, .cloud::after {
      content: '';
      position: absolute;
      background: inherit;
      border-radius: 50%;
    }
    .cloud::before { width: 60%; height: 150%; top: -40%; left: 15%; }
    .cloud::after  { width: 40%; height: 130%; top: -30%; right: 10%; }
    @keyframes drift {
      from { transform: translateX(-300px); }
      to   { transform: translateX(110vw);  }
    }

    /* Ground */
    .ground {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      height: 80px;
      background: linear-gradient(180deg, #1a5c2a 0%, #0d3a18 100%);
      z-index: 3;
      border-top: 3px solid #2a8a3a;
    }
    .ground::before {
      content: '';
      position: absolute;
      top: -12px; left: 0; right: 0;
      height: 12px;
      background: repeating-linear-gradient(
        90deg,
        #2a8a3a 0px, #2a8a3a 30px,
        #1a5c2a 30px, #1a5c2a 60px
      );
    }

    /* ── Pipes (decorative) ─────────────────────────────────── */
    .pipe {
      position: fixed;
      width: 60px;
      z-index: 4;
      pointer-events: none;
    }
    .pipe-top {
      top: 0;
      background: linear-gradient(90deg, #2d7a2d, #4daa4d, #2d7a2d);
      border-radius: 0 0 4px 4px;
    }
    .pipe-top::after {
      content: '';
      position: absolute;
      bottom: 0; left: -6px; right: -6px;
      height: 20px;
      background: linear-gradient(90deg, #236623, #3d8a3d, #236623);
      border-radius: 4px;
    }
    .pipe-bottom {
      bottom: 80px;
      background: linear-gradient(90deg, #2d7a2d, #4daa4d, #2d7a2d);
      border-radius: 4px 4px 0 0;
    }
    .pipe-bottom::before {
      content: '';
      position: absolute;
      top: 0; left: -6px; right: -6px;
      height: 20px;
      background: linear-gradient(90deg, #236623, #3d8a3d, #236623);
      border-radius: 4px;
    }

    /* ── Page Layout ────────────────────────────────────────── */
    .page {
      position: relative;
      z-index: 10;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem 1.5rem 120px;
      gap: 0;
    }

    /* ── Hero Card ──────────────────────────────────────────── */
    .hero-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-radius: 28px;
      padding: 3rem 2.5rem 2.5rem;
      max-width: 420px;
      width: 100%;
      text-align: center;
      box-shadow: 0 8px 40px rgba(0,0,0,0.4);
      animation: floatIn 0.7s cubic-bezier(0.22, 1, 0.36, 1) both;
    }
    @keyframes floatIn {
      from { opacity: 0; transform: translateY(30px); }
      to   { opacity: 1; transform: translateY(0);    }
    }

    /* ── Logo ───────────────────────────────────────────────── */
    .logo-wrap {
      position: relative;
      display: inline-block;
      margin-bottom: 1.2rem;
      animation: bobble 3s ease-in-out infinite;
    }
    @keyframes bobble {
      0%, 100% { transform: translateY(0);    }
      50%       { transform: translateY(-10px); }
    }
    .logo-wrap img {
      width: 110px;
      height: 110px;
      object-fit: contain;
      filter: drop-shadow(0 4px 20px rgba(245,200,66,0.5));
    }
    .logo-halo {
      position: absolute;
      inset: -10px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(245,200,66,0.2) 0%, transparent 70%);
      animation: pulse 2.5s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1);    opacity: 0.6; }
      50%       { transform: scale(1.15); opacity: 1;   }
    }

    /* ── Title ──────────────────────────────────────────────── */
    .game-title {
      font-family: 'Fredoka One', cursive;
      font-size: 3rem;
      letter-spacing: 1px;
      line-height: 1;
      background: linear-gradient(135deg, var(--gold) 0%, #fff 50%, var(--teal) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 0.4rem;
    }
    .tagline {
      font-size: 0.95rem;
      color: var(--text-soft);
      font-weight: 600;
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-bottom: 2rem;
    }

    /* ── Stats Strip ────────────────────────────────────────── */
    .stats-strip {
      display: flex;
      gap: 1rem;
      justify-content: center;
      margin-bottom: 2rem;
    }
    .stat-pill {
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 100px;
      padding: 0.35rem 1rem;
      font-size: 0.78rem;
      font-weight: 700;
      color: var(--text-soft);
      letter-spacing: 0.5px;
    }
    .stat-pill span {
      color: var(--gold);
    }

    /* ── Buttons ────────────────────────────────────────────── */
    .btn-group {
      display: flex;
      flex-direction: column;
      gap: 0.85rem;
    }
    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.6rem;
      width: 100%;
      padding: 0.95rem 1.5rem;
      border-radius: 14px;
      font-family: 'Nunito', sans-serif;
      font-size: 1.05rem;
      font-weight: 800;
      text-decoration: none;
      border: none;
      cursor: pointer;
      transition: transform 0.15s ease, box-shadow 0.15s ease, filter 0.15s ease;
      letter-spacing: 0.3px;
    }
    .btn:active { transform: scale(0.97); }

    .btn-primary {
      background: linear-gradient(135deg, var(--gold) 0%, #e6a800 100%);
      color: #1a0f00;
      box-shadow: 0 4px 20px rgba(245,200,66,0.4);
    }
    .btn-primary:hover {
      filter: brightness(1.08);
      box-shadow: 0 6px 28px rgba(245,200,66,0.55);
      transform: translateY(-2px);
    }

    .btn-secondary {
      background: linear-gradient(135deg, var(--teal) 0%, var(--teal-dark) 100%);
      color: #001a14;
      box-shadow: 0 4px 20px rgba(0,212,170,0.35);
    }
    .btn-secondary:hover {
      filter: brightness(1.08);
      box-shadow: 0 6px 28px rgba(0,212,170,0.5);
      transform: translateY(-2px);
    }

    .btn-ghost {
      background: rgba(255,255,255,0.06);
      color: var(--text-soft);
      border: 1px solid rgba(255,255,255,0.14);
    }
    .btn-ghost:hover {
      background: rgba(255,255,255,0.1);
      color: var(--white);
      transform: translateY(-1px);
    }

    .btn-icon {
      font-size: 1.2rem;
    }

    /* ── Divider ────────────────────────────────────────────── */
    .divider {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      margin: 0.25rem 0;
      color: rgba(255,255,255,0.2);
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 1px;
    }
    .divider::before, .divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: rgba(255,255,255,0.12);
    }

    /* ── Footer Links ───────────────────────────────────────── */
    .footer-links {
      margin-top: 1.8rem;
      display: flex;
      gap: 1.5rem;
      justify-content: center;
      flex-wrap: wrap;
    }
    .footer-links a {
      color: rgba(255,255,255,0.35);
      font-size: 0.78rem;
      font-weight: 600;
      text-decoration: none;
      letter-spacing: 0.5px;
      transition: color 0.2s;
    }
    .footer-links a:hover { color: rgba(255,255,255,0.75); }

    /* ── Auth Check Overlay ─────────────────────────────────── */
    #loading-screen {
      position: fixed;
      inset: 0;
      background: var(--sky-top);
      z-index: 999;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 1rem;
      transition: opacity 0.4s ease;
    }
    #loading-screen.hidden {
      opacity: 0;
      pointer-events: none;
    }
    .spinner {
      width: 40px; height: 40px;
      border: 3px solid rgba(245,200,66,0.2);
      border-top-color: var(--gold);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Responsive ─────────────────────────────────────────── */
    @media (max-width: 420px) {
      .hero-card { padding: 2.2rem 1.5rem 2rem; border-radius: 20px; }
      .game-title { font-size: 2.4rem; }
    }
  </style>
</head>
<body>

  <!-- Loading screen while Firebase checks auth -->
  <div id="loading-screen">
    <div class="spinner"></div>
  </div>

  <!-- Sky background -->
  <div class="sky"></div>

  <!-- Stars -->
  <div class="stars" id="stars"></div>

  <!-- Drifting clouds -->
  <div class="clouds" id="clouds"></div>

  <!-- Decorative pipes (left side) -->
  <div class="pipe pipe-top"  style="left:5%; height:140px;"></div>
  <div class="pipe pipe-bottom" style="left:5%; height:110px;"></div>

  <!-- Decorative pipes (right side) -->
  <div class="pipe pipe-top"  style="right:8%; height:200px;"></div>
  <div class="pipe pipe-bottom" style="right:8%; height:80px;"></div>

  <!-- Ground -->
  <div class="ground"></div>

  <!-- Main content -->
  <main class="page">
    <div class="hero-card">

      <!-- Logo -->
      <div class="logo-wrap">
        <div class="logo-halo"></div>
        <img
          src="https://raw.githubusercontent.com/Safary01/hoverbird/main/assets/images/hoverbird.png"
          alt="HoverBird mascot"
          onerror="this.style.display='none'; document.getElementById('logo-fallback').style.display='block';"
        />
        <div id="logo-fallback" style="display:none; font-size:5rem; line-height:1;">🐦</div>
      </div>

      <!-- Title -->
      <h1 class="game-title">HoverBird</h1>
      <p class="tagline">Compete · Fly · Dominate</p>

      <!-- Stats pills -->
      <div class="stats-strip">
        <div class="stat-pill">🏆 <span>Top Scores</span> Weekly</div>
        <div class="stat-pill">🌍 <span>Global</span> Ranks</div>
      </div>

      <!-- Buttons -->
      <div class="btn-group">
        <a href="login.html" class="btn btn-primary">
          <span class="btn-icon">🎮</span> Play Now
        </a>

        <div class="divider">or</div>

        <a href="register.html" class="btn btn-secondary">
          <span class="btn-icon">✨</span> Create Account
        </a>

        <a href="leaderboard.html" class="btn btn-ghost">
          <span class="btn-icon">📊</span> View Leaderboard
        </a>
      </div>

      <!-- Footer links -->
      <nav class="footer-links" aria-label="Extra links">
        <a href="hall-of-fame.html">🏅 Hall of Fame</a>
        <a href="how-to-play.html">❓ How to Play</a>
        <a href="privacy-policy.html">🔒 Privacy</a>
      </nav>
    </div>
  </main>

  <!-- Firebase auth redirect logic -->
  <script type="module">
    import { auth }        from "./js/firebase-config.js";
    import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

    const loadingScreen = document.getElementById("loading-screen");

    onAuthStateChanged(auth, (user) => {
      if (user) {
        // Already logged in → send straight to dashboard
        window.location.replace("dashboard.html");
      } else {
        // Not logged in → show the landing page
        loadingScreen.classList.add("hidden");
        setTimeout(() => loadingScreen.remove(), 400);
      }
    });
  </script>

  <!-- Stars generator -->
  <script>
    const starsContainer = document.getElementById("stars");
    for (let i = 0; i < 80; i++) {
      const s = document.createElement("div");
      s.className = "star";
      const size = Math.random() * 2.5 + 0.5;
      s.style.cssText = `
        width:${size}px; height:${size}px;
        top:${Math.random()*70}%;
        left:${Math.random()*100}%;
        --d:${(Math.random()*3+2).toFixed(1)}s;
        --delay:-${(Math.random()*4).toFixed(1)}s;
        --op:${(Math.random()*0.5+0.4).toFixed(2)};
      `;
      starsContainer.appendChild(s);
    }

    // Clouds generator
    const cloudsContainer = document.getElementById("clouds");
    const cloudData = [
      { top:"12%", width:"200px", height:"55px", spd:"70s",  delay:"-10s" },
      { top:"25%", width:"160px", height:"40px", spd:"90s",  delay:"-35s" },
      { top:"40%", width:"280px", height:"65px", spd:"55s",  delay:"-5s"  },
      { top:"18%", width:"120px", height:"35px", spd:"110s", delay:"-60s" },
      { top:"55%", width:"220px", height:"50px", spd:"80s",  delay:"-25s" },
    ];
    cloudData.forEach(c => {
      const el = document.createElement("div");
      el.className = "cloud";
      el.style.cssText = `top:${c.top}; width:${c.width}; height:${c.height}; --spd:${c.spd}; animation-delay:${c.delay};`;
      cloudsContainer.appendChild(el);
    });
  </script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HoverBird — Create Account</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet" />

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --sky-top:      #0a1628;
      --sky-mid:      #0d2a5c;
      --sky-low:      #1a4a8a;
      --gold:         #f5c842;
      --teal:         #00d4aa;
      --teal-dark:    #009977;
      --danger:       #ff5a5a;
      --danger-bg:    rgba(255,90,90,0.12);
      --success:      #00d4aa;
      --success-bg:   rgba(0,212,170,0.12);
      --white:        #ffffff;
      --text-soft:    rgba(255,255,255,0.65);
      --text-muted:   rgba(255,255,255,0.35);
      --card-bg:      rgba(255,255,255,0.06);
      --card-border:  rgba(255,255,255,0.12);
      --input-bg:     rgba(255,255,255,0.07);
      --input-border: rgba(255,255,255,0.15);
      --input-focus:  rgba(245,200,66,0.5);
    }

    html, body {
      min-height: 100%;
      font-family: 'Nunito', sans-serif;
      background: var(--sky-top);
      color: var(--white);
      overflow-x: hidden;
    }

    /* ── Background ─────────────────────────────────────────── */
    .sky {
      position: fixed; inset: 0;
      background: linear-gradient(180deg, var(--sky-top) 0%, var(--sky-mid) 55%, var(--sky-low) 100%);
      z-index: 0;
    }
    .stars { position: fixed; inset: 0; z-index: 1; pointer-events: none; }
    .star {
      position: absolute; background: #fff; border-radius: 50%;
      animation: twinkle var(--d,3s) ease-in-out infinite var(--delay,0s); opacity: 0;
    }
    @keyframes twinkle { 0%,100%{opacity:0} 50%{opacity:var(--op,0.8)} }

    .ground {
      position: fixed; bottom: 0; left: 0; right: 0; height: 70px;
      background: linear-gradient(180deg, #1a5c2a 0%, #0d3a18 100%);
      z-index: 3; border-top: 3px solid #2a8a3a;
    }
    .ground::before {
      content:''; position:absolute; top:-10px; left:0; right:0; height:10px;
      background: repeating-linear-gradient(90deg,#2a8a3a 0,#2a8a3a 30px,#1a5c2a 30px,#1a5c2a 60px);
    }

    /* ── Layout ─────────────────────────────────────────────── */
    .page {
      position: relative; z-index: 10;
      min-height: 100vh;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      padding: 2rem 1.5rem 100px;
    }

    /* ── Back link ──────────────────────────────────────────── */
    .back-link {
      position: fixed; top: 1.2rem; left: 1.4rem; z-index: 20;
      display: flex; align-items: center; gap: 0.4rem;
      color: var(--text-soft); text-decoration: none;
      font-size: 0.85rem; font-weight: 700; transition: color 0.2s;
    }
    .back-link:hover { color: var(--white); }
    .back-link svg { width:18px; height:18px; stroke:currentColor; fill:none; stroke-width:2.5; stroke-linecap:round; stroke-linejoin:round; }

    /* ── Card ───────────────────────────────────────────────── */
    .card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-radius: 28px;
      padding: 2.8rem 2.5rem 2.5rem;
      width: 100%; max-width: 440px;
      box-shadow: 0 8px 40px rgba(0,0,0,0.45);
      animation: floatIn 0.6s cubic-bezier(0.22,1,0.36,1) both;
    }
    @keyframes floatIn { from{opacity:0;transform:translateY(24px)} to{opacity:1;transform:translateY(0)} }

    /* ── Header ─────────────────────────────────────────────── */
    .card-header {
      display: flex; flex-direction: column; align-items: center;
      gap: 0.5rem; margin-bottom: 2rem; text-align: center;
    }
    .logo-sm {
      width: 60px; height: 60px; object-fit: contain;
      filter: drop-shadow(0 3px 12px rgba(245,200,66,0.45));
      animation: bobble 3s ease-in-out infinite;
    }
    @keyframes bobble { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-7px)} }
    .card-title {
      font-family: 'Fredoka One', cursive; font-size: 1.9rem;
      background: linear-gradient(135deg, var(--teal) 0%, #fff 100%);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
    }
    .card-sub { font-size: 0.88rem; color: var(--text-soft); font-weight: 600; }

    /* ── Form ───────────────────────────────────────────────── */
    .form-group { margin-bottom: 1.1rem; }
    .form-label {
      display: block; font-size: 0.82rem; font-weight: 700;
      color: var(--text-soft); letter-spacing: 0.5px;
      margin-bottom: 0.45rem; text-transform: uppercase;
    }
    .input-wrap { position: relative; }
    .input-icon {
      position: absolute; left: 13px; top: 50%; transform: translateY(-50%);
      opacity: 0.4; pointer-events: none;
    }
    .input-icon svg { width:18px; height:18px; stroke:currentColor; fill:none; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; display:block; }

    .form-input {
      width: 100%; padding: 0.8rem 1rem 0.8rem 2.6rem;
      background: var(--input-bg);
      border: 1.5px solid var(--input-border);
      border-radius: 12px; color: var(--white);
      font-family: 'Nunito', sans-serif; font-size: 0.98rem; font-weight: 600;
      outline: none; transition: border-color 0.2s, box-shadow 0.2s, background 0.2s;
      -webkit-text-fill-color: var(--white);
    }
    .form-input::placeholder { color: rgba(255,255,255,0.25); font-weight: 400; }
    .form-input:focus {
      border-color: var(--gold);
      box-shadow: 0 0 0 3px var(--input-focus);
      background: rgba(255,255,255,0.1);
    }
    .form-input.error  { border-color: var(--danger); box-shadow: 0 0 0 3px rgba(255,90,90,0.2); }
    .form-input.valid  { border-color: var(--teal);   box-shadow: 0 0 0 3px rgba(0,212,170,0.15); }

    /* Password toggle */
    .pw-toggle {
      position: absolute; right: 12px; top: 50%; transform: translateY(-50%);
      background: none; border: none; cursor: pointer;
      color: var(--text-muted); padding: 2px; transition: color 0.2s;
    }
    .pw-toggle:hover { color: var(--text-soft); }
    .pw-toggle svg { width:18px; height:18px; stroke:currentColor; fill:none; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; display:block; }

    /* Inline field hint */
    .field-hint {
      font-size: 0.76rem; font-weight: 600; margin-top: 0.35rem;
      min-height: 1rem; transition: color 0.2s;
      padding-left: 2px;
    }
    .field-hint.ok  { color: var(--teal); }
    .field-hint.bad { color: var(--danger); }
    .field-hint.info{ color: var(--text-muted); }

    /* ── Password strength bar ──────────────────────────────── */
    .strength-wrap { margin-top: 0.5rem; }
    .strength-bar {
      display: flex; gap: 4px; margin-bottom: 0.3rem;
    }
    .strength-seg {
      flex: 1; height: 4px; border-radius: 2px;
      background: rgba(255,255,255,0.1);
      transition: background 0.3s;
    }
    .strength-label {
      font-size: 0.75rem; font-weight: 700;
      color: var(--text-muted); transition: color 0.3s;
    }

    /* ── Alert ──────────────────────────────────────────────── */
    .alert {
      display: none; align-items: flex-start; gap: 0.6rem;
      padding: 0.75rem 1rem; border-radius: 10px;
      font-size: 0.85rem; font-weight: 700; margin-bottom: 1.1rem; line-height: 1.4;
    }
    .alert.show { display: flex; }
    .alert-error   { background: var(--danger-bg);  color: var(--danger);  border: 1px solid rgba(255,90,90,0.25); }
    .alert-success { background: var(--success-bg); color: var(--success); border: 1px solid rgba(0,212,170,0.25); }
    .alert svg { width:16px; height:16px; flex-shrink:0; margin-top:1px; stroke:currentColor; fill:none; stroke-width:2.5; stroke-linecap:round; stroke-linejoin:round; }

    /* ── Submit button ──────────────────────────────────────── */
    .btn-submit {
      width: 100%; padding: 0.95rem;
      background: linear-gradient(135deg, var(--teal) 0%, var(--teal-dark) 100%);
      color: #001a14; font-family: 'Nunito', sans-serif;
      font-size: 1.05rem; font-weight: 800;
      border: none; border-radius: 14px; cursor: pointer;
      box-shadow: 0 4px 20px rgba(0,212,170,0.35);
      transition: transform 0.15s, box-shadow 0.15s, filter 0.15s;
      display: flex; align-items: center; justify-content: center; gap: 0.5rem;
      margin-top: 0.5rem;
    }
    .btn-submit:hover:not(:disabled) {
      filter: brightness(1.08);
      box-shadow: 0 6px 28px rgba(0,212,170,0.5);
      transform: translateY(-2px);
    }
    .btn-submit:active:not(:disabled) { transform: scale(0.97); }
    .btn-submit:disabled { opacity: 0.55; cursor: not-allowed; }

    .btn-spinner {
      display: none; width:18px; height:18px;
      border: 2.5px solid rgba(0,26,20,0.25);
      border-top-color: #001a14; border-radius: 50%;
      animation: spin 0.75s linear infinite;
    }
    .btn-submit.loading .btn-spinner { display: block; }
    .btn-submit.loading .btn-text { opacity: 0.6; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Divider ────────────────────────────────────────────── */
    .divider {
      display: flex; align-items: center; gap: 0.75rem;
      margin: 1.4rem 0; color: var(--text-muted);
      font-size: 0.75rem; font-weight: 700; letter-spacing: 1px;
    }
    .divider::before, .divider::after {
      content:''; flex:1; height:1px; background: rgba(255,255,255,0.1);
    }

    /* ── Google button ──────────────────────────────────────── */
    .btn-google {
      width: 100%; padding: 0.85rem;
      background: rgba(255,255,255,0.07);
      color: var(--white); font-family: 'Nunito', sans-serif;
      font-size: 0.98rem; font-weight: 700;
      border: 1.5px solid rgba(255,255,255,0.15); border-radius: 14px;
      cursor: pointer; transition: background 0.2s, border-color 0.2s, transform 0.15s;
      display: flex; align-items: center; justify-content: center; gap: 0.65rem;
    }
    .btn-google:hover { background: rgba(255,255,255,0.12); border-color: rgba(255,255,255,0.25); transform: translateY(-1px); }
    .btn-google:active { transform: scale(0.97); }
    .google-icon { width:20px; height:20px; flex-shrink:0; }

    /* ── Terms notice ───────────────────────────────────────── */
    .terms-notice {
      font-size: 0.76rem; color: var(--text-muted); font-weight: 600;
      text-align: center; margin-top: 1rem; line-height: 1.5;
    }
    .terms-notice a { color: var(--text-soft); text-decoration: underline; transition: color 0.2s; }
    .terms-notice a:hover { color: var(--white); }

    /* ── Footer ─────────────────────────────────────────────── */
    .card-footer {
      text-align: center; margin-top: 1.4rem;
      font-size: 0.88rem; color: var(--text-soft); font-weight: 600;
    }
    .card-footer a { color: var(--gold); text-decoration: none; font-weight: 800; transition: opacity 0.2s; }
    .card-footer a:hover { opacity: 0.75; }

    @media (max-width: 460px) {
      .card { padding: 2.2rem 1.4rem 2rem; border-radius: 20px; }
      .card-title { font-size: 1.6rem; }
    }
  </style>
</head>
<body>

  <div class="sky"></div>
  <div class="stars" id="stars"></div>
  <div class="ground"></div>

  <a href="index.html" class="back-link">
    <svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg>
    Home
  </a>

  <main class="page">
    <div class="card">

      <!-- Header -->
      <div class="card-header">
        <img
          src="https://raw.githubusercontent.com/Safary01/hoverbird/main/assets/images/hoverbird.png"
          alt="HoverBird" class="logo-sm"
          onerror="this.style.display='none'"
        />
        <h1 class="card-title">Join HoverBird</h1>
        <p class="card-sub">Create your account and start competing</p>
      </div>

      <!-- Alerts -->
      <div class="alert alert-error" id="alert-error" role="alert">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
        <span id="alert-error-text"></span>
      </div>
      <div class="alert alert-success" id="alert-success" role="alert">
        <svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>
        <span id="alert-success-text"></span>
      </div>

      <!-- Form -->
      <form id="register-form" novalidate>

        <!-- Username -->
        <div class="form-group">
          <label class="form-label" for="username">Username</label>
          <div class="input-wrap">
            <span class="input-icon"><svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg></span>
            <input
              type="text" id="username" name="username"
              class="form-input" placeholder="CoolBird99"
              autocomplete="username" maxlength="20" required
            />
          </div>
          <p class="field-hint info" id="hint-username">3–20 characters, letters and numbers only.</p>
        </div>

        <!-- Email -->
        <div class="form-group">
          <label class="form-label" for="email">Email</label>
          <div class="input-wrap">
            <span class="input-icon"><svg viewBox="0 0 24 24"><rect x="2" y="4" width="20" height="16" rx="2"/><polyline points="2,4 12,13 22,4"/></svg></span>
            <input
              type="email" id="email" name="email"
              class="form-input" placeholder="you@example.com"
              autocomplete="email" required
            />
          </div>
          <p class="field-hint info" id="hint-email"></p>
        </div>

        <!-- Phone Number -->
        <div class="form-group">
          <label class="form-label" for="phone">Phone Number</label>
          <div class="input-wrap">
            <span class="input-icon"><svg viewBox="0 0 24 24"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6A19.79 19.79 0 0 1 2.12 4.18 2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 22 16.92z"/></svg></span>
            <input
              type="tel" id="phone" name="phone"
              class="form-input" placeholder="+234 800 000 0000"
              autocomplete="tel" required
            />
          </div>
          <p class="field-hint info" id="hint-phone">Nigerian or international format e.g. +2348012345678</p>
        </div>

        <!-- Password -->
        <div class="form-group">
          <label class="form-label" for="password">Password</label>
          <div class="input-wrap">
            <span class="input-icon"><svg viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg></span>
            <input
              type="password" id="password" name="password"
              class="form-input" placeholder="••••••••"
              autocomplete="new-password" required
            />
            <button type="button" class="pw-toggle" id="pw-toggle-1" aria-label="Toggle password">
              <svg id="eye-1" viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
          </div>
          <!-- Strength bar -->
          <div class="strength-wrap" id="strength-wrap" style="display:none;">
            <div class="strength-bar">
              <div class="strength-seg" id="seg1"></div>
              <div class="strength-seg" id="seg2"></div>
              <div class="strength-seg" id="seg3"></div>
              <div class="strength-seg" id="seg4"></div>
            </div>
            <span class="strength-label" id="strength-label">Weak</span>
          </div>
          <p class="field-hint info" id="hint-password">At least 8 characters.</p>
        </div>

        <!-- Confirm Password -->
        <div class="form-group">
          <label class="form-label" for="confirm-password">Confirm Password</label>
          <div class="input-wrap">
            <span class="input-icon"><svg viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg></span>
            <input
              type="password" id="confirm-password" name="confirm-password"
              class="form-input" placeholder="••••••••"
              autocomplete="new-password" required
            />
            <button type="button" class="pw-toggle" id="pw-toggle-2" aria-label="Toggle confirm password">
              <svg id="eye-2" viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
          </div>
          <p class="field-hint info" id="hint-confirm"></p>
        </div>

        <!-- Submit -->
        <button type="submit" class="btn-submit" id="register-btn">
          <div class="btn-spinner"></div>
          <span class="btn-text">✨ Create My Account</span>
        </button>
      </form>

      <!-- Google -->
      <div class="divider">or sign up with</div>
      <button class="btn-google" id="google-btn">
        <svg class="google-icon" viewBox="0 0 48 48">
          <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
          <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
          <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
          <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
        </svg>
        Continue with Google
      </button>

      <!-- Terms -->
      <p class="terms-notice">
        By creating an account you agree to our
        <a href="privacy-policy.html">Privacy Policy</a>.
      </p>

      <!-- Footer -->
      <p class="card-footer">
        Already have an account? <a href="login.html">Sign in</a>
      </p>

    </div>
  </main>

  <!-- Firebase logic -->
  <script type="module">
    import { auth, db } from "./js/firebase-config.js";
    import {
      createUserWithEmailAndPassword,
      updateProfile,
      GoogleAuthProvider,
      signInWithPopup,
      onAuthStateChanged
    } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
    import {
      doc, setDoc, getDoc, serverTimestamp, query,
      collection, where, getDocs
    } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

    // Redirect if already logged in
    onAuthStateChanged(auth, (user) => {
      if (user) window.location.replace("dashboard.html");
    });

    // ── Helpers ────────────────────────────────────────────
    const registerBtn = document.getElementById("register-btn");
    const errorBox    = document.getElementById("alert-error");
    const errorText   = document.getElementById("alert-error-text");
    const successBox  = document.getElementById("alert-success");
    const successText = document.getElementById("alert-success-text");

    function showError(msg)   { errorText.textContent = msg;   errorBox.classList.add("show");   successBox.classList.remove("show"); }
    function showSuccess(msg) { successText.textContent = msg; successBox.classList.add("show"); errorBox.classList.remove("show"); }
    function clearAlerts()    { errorBox.classList.remove("show"); successBox.classList.remove("show"); }

    function setLoading(on) {
      registerBtn.disabled = on;
      registerBtn.classList.toggle("loading", on);
    }

    function friendlyError(code) {
      const map = {
        "auth/email-already-in-use":  "An account with this email already exists.",
        "auth/invalid-email":         "Please enter a valid email address.",
        "auth/weak-password":         "Password must be at least 6 characters.",
        "auth/network-request-failed":"Network error. Check your connection.",
        "auth/popup-closed-by-user":  "Sign-in popup was closed. Please try again.",
        "auth/too-many-requests":     "Too many attempts. Please wait a moment.",
      };
      return map[code] || "Something went wrong. Please try again.";
    }

    // ── Live validation helpers ────────────────────────────
    const usernameInput = document.getElementById("username");
    const emailInput    = document.getElementById("email");
    const phoneInput    = document.getElementById("phone");
    const passwordInput = document.getElementById("password");
    const confirmInput  = document.getElementById("confirm-password");

    function setFieldState(input, hint, state, msg) {
      input.classList.remove("error", "valid");
      hint.classList.remove("ok", "bad", "info");
      if (state === "ok")   { input.classList.add("valid"); hint.classList.add("ok"); }
      if (state === "bad")  { input.classList.add("error"); hint.classList.add("bad"); }
      if (state === "info") { hint.classList.add("info"); }
      hint.textContent = msg;
    }

    // Username validation
    usernameInput.addEventListener("input", () => {
      const val = usernameInput.value.trim();
      const hint = document.getElementById("hint-username");
      if (!val) { setFieldState(usernameInput, hint, "info", "3–20 characters, letters and numbers only."); return; }
      if (!/^[a-zA-Z0-9_]{3,20}$/.test(val)) {
        setFieldState(usernameInput, hint, "bad", "Only letters, numbers, underscores. 3–20 chars.");
      } else {
        setFieldState(usernameInput, hint, "ok", "Looks good!");
      }
    });

    // Email validation
    emailInput.addEventListener("input", () => {
      const val = emailInput.value.trim();
      const hint = document.getElementById("hint-email");
      if (!val) { setFieldState(emailInput, hint, "info", ""); return; }
      if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(val)) {
        setFieldState(emailInput, hint, "bad", "Please enter a valid email.");
      } else {
        setFieldState(emailInput, hint, "ok", "Valid email.");
      }
    });

    // Phone validation
    phoneInput.addEventListener("input", () => {
      const val  = phoneInput.value.trim();
      const hint = document.getElementById("hint-phone");
      if (!val) { setFieldState(phoneInput, hint, "info", "Nigerian or international format e.g. +2348012345678"); return; }
      // Accept formats: +234XXXXXXXXXX, 0XXXXXXXXXX, or 11+ digit international
      const clean = val.replace(/[\s\-().]/g, "");
      if (!/^(\+?[1-9]\d{7,14}|0\d{10})$/.test(clean)) {
        setFieldState(phoneInput, hint, "bad", "Enter a valid phone number.");
      } else {
        setFieldState(phoneInput, hint, "ok", "Valid phone number.");
      }
    });

    // Password strength
    passwordInput.addEventListener("input", () => {
      const val = passwordInput.value;
      const hint = document.getElementById("hint-password");
      const wrap = document.getElementById("strength-wrap");
      const segs = [document.getElementById("seg1"), document.getElementById("seg2"),
                    document.getElementById("seg3"), document.getElementById("seg4")];
      const label = document.getElementById("strength-label");

      if (!val) {
        wrap.style.display = "none";
        setFieldState(passwordInput, hint, "info", "At least 8 characters.");
        return;
      }

      wrap.style.display = "block";

      let score = 0;
      if (val.length >= 8)  score++;
      if (/[A-Z]/.test(val)) score++;
      if (/[0-9]/.test(val)) score++;
      if (/[^a-zA-Z0-9]/.test(val)) score++;

      const colors  = ["#ff5a5a", "#ffaa40", "#f5c842", "#00d4aa"];
      const labels  = ["Weak", "Fair", "Good", "Strong"];
      const states  = ["bad", "bad", "info", "ok"];
      const msgs    = [
        "Too weak — add uppercase, numbers or symbols.",
        "Fair — try adding more variety.",
        "Good password!",
        "Strong password! 💪"
      ];

      segs.forEach((seg, i) => {
        seg.style.background = i < score ? colors[score - 1] : "rgba(255,255,255,0.1)";
      });
      label.textContent = labels[score - 1] || "Weak";
      label.style.color = colors[score - 1] || "#ff5a5a";
      setFieldState(passwordInput, hint, states[score - 1] || "bad", msgs[score - 1] || msgs[0]);

      // Re-check confirm if already typed
      if (confirmInput.value) checkConfirm();
    });

    function checkConfirm() {
      const hint = document.getElementById("hint-confirm");
      if (!confirmInput.value) { setFieldState(confirmInput, hint, "info", ""); return; }
      if (confirmInput.value !== passwordInput.value) {
        setFieldState(confirmInput, hint, "bad", "Passwords do not match.");
      } else {
        setFieldState(confirmInput, hint, "ok", "Passwords match!");
      }
    }
    confirmInput.addEventListener("input", checkConfirm);

    // ── Check username availability ────────────────────────
    async function isUsernameTaken(username) {
      const q = query(collection(db, "users"), where("username", "==", username));
      const snap = await getDocs(q);
      return !snap.empty;
    }

    // ── Season key helper ──────────────────────────────────
    function currentSeasonKey() {
      const now = new Date();
      return `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,"0")}`;
    }

    // ── Create Firestore doc ───────────────────────────────
    async function createUserDoc(uid, username, email, phone = "", emailVerified = false) {
      const data = {
        username,
        email,
        phone,
        emailVerified,
        bestScore:   0,
        seasonScore: 0,
        gamesPlayed: 0,
        season:      currentSeasonKey(),
        createdAt:   serverTimestamp(),
      };
      console.log("Writing to Firestore:", uid, data);
      await setDoc(doc(db, "users", uid), data);
      console.log("Firestore write successful");
    }

    // ── Register with Email ────────────────────────────────
    document.getElementById("register-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      clearAlerts();

      const username = usernameInput.value.trim();
      const email    = emailInput.value.trim();
      const phone    = phoneInput.value.trim();
      const password = passwordInput.value;
      const confirm  = confirmInput.value;

      // Client-side validation
      if (!username || !email || !phone || !password || !confirm) {
        showError("Please fill in all fields."); return;
      }
      if (!/^[a-zA-Z0-9_]{3,20}$/.test(username)) {
        showError("Username must be 3–20 characters, letters/numbers/underscores only."); return;
      }
      const cleanPhone = phone.replace(/[\s\-().]/g, "");
      if (!/^(\+?[1-9]\d{7,14}|0\d{10})$/.test(cleanPhone)) {
        showError("Please enter a valid phone number."); return;
      }
      if (password.length < 8) {
        showError("Password must be at least 8 characters."); return;
      }
      if (password !== confirm) {
        showError("Passwords do not match."); return;
      }

      setLoading(true);

      // ── Step 1: Create Firebase Auth account first ────────
      // (Must be signed in before Firestore queries run)
      let cred;
      try {
        cred = await createUserWithEmailAndPassword(auth, email, password);
        await updateProfile(cred.user, { displayName: username });
      } catch (err) {
        console.error("Auth error:", err.code, err.message);
        showError(friendlyError(err.code));
        setLoading(false); return;
      }

      // ── Step 2: Now check username availability ───────────
      // User is now signed in so Firestore read is allowed
      try {
        const taken = await isUsernameTaken(username);
        if (taken) {
          // Username taken — delete the auth account we just made and bail
          await cred.user.delete();
          showError("That username is already taken. Please choose another.");
          setLoading(false); return;
        }
      } catch (err) {
        console.error("Username check failed:", err.code, err.message);
        await cred.user.delete();
        showError("Could not verify username. Check your connection and try again.");
        setLoading(false); return;
      }

      // ── Step 3: Create Firestore user document ────────────
      try {
        // Force token refresh so Firestore auth is fully ready
        await cred.user.getIdToken(true);
        await createUserDoc(cred.user.uid, username, email, cleanPhone, cred.user.emailVerified);
      } catch (err) {
        console.error("Firestore error:", err.code, err.message, JSON.stringify(err));
        showError("Account created but profile could not be saved: " + err.message);
        setLoading(false); return;
      }

      showSuccess("Account created! Taking you to your dashboard…");
      setTimeout(() => window.location.replace("dashboard.html"), 1000);
    });

    // ── Google Sign-Up ─────────────────────────────────────
    document.getElementById("google-btn").addEventListener("click", async () => {
      clearAlerts();
      const provider = new GoogleAuthProvider();
      try {
        const result = await signInWithPopup(auth, provider);
        const user   = result.user;
        const ref    = doc(db, "users", user.uid);
        const snap   = await getDoc(ref);

        if (!snap.exists()) {
          // New Google user — create Firestore doc
          // Google accounts are always email-verified
          const username = user.displayName
            ? user.displayName.replace(/\s+/g, "").slice(0, 20)
            : user.email.split("@")[0];
          await createUserDoc(user.uid, username, user.email, "", user.emailVerified);
        }

        showSuccess("Signed up with Google! Redirecting…");
        setTimeout(() => window.location.replace("dashboard.html"), 800);
      } catch (err) {
        showError(friendlyError(err.code));
      }
    });

    // ── Password visibility toggles ────────────────────────
    function makeToggle(btnId, inputId, eyeId) {
      const btn   = document.getElementById(btnId);
      const input = document.getElementById(inputId);
      const eye   = document.getElementById(eyeId);
      const open   = `<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>`;
      const closed = `<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/><path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/><line x1="1" y1="1" x2="23" y2="23"/>`;
      btn.addEventListener("click", () => {
        const hidden = input.type === "password";
        input.type   = hidden ? "text" : "password";
        eye.innerHTML = hidden ? closed : open;
      });
    }
    makeToggle("pw-toggle-1", "password",         "eye-1");
    makeToggle("pw-toggle-2", "confirm-password", "eye-2");
  </script>

  <!-- Stars -->
  <script>
    const c = document.getElementById("stars");
    for (let i = 0; i < 70; i++) {
      const s = document.createElement("div");
      s.className = "star";
      const sz = Math.random()*2+0.5;
      s.style.cssText=`width:${sz}px;height:${sz}px;top:${Math.random()*70}%;left:${Math.random()*100}%;--d:${(Math.random()*3+2).toFixed(1)}s;--delay:-${(Math.random()*4).toFixed(1)}s;--op:${(Math.random()*0.5+0.4).toFixed(2)};`;
      c.appendChild(s);
    }
  </script>

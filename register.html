<!DOCTYPE html>
<html>
<head>
  <title>HoverBird - Register</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <h2>Create Account</h2>

  <input id="username" placeholder="Username (no spaces)" />
  <br><br>

  <input id="email" type="email" placeholder="Email" />
  <br><br>

  <input id="phone" placeholder="Phone Number" />
  <br><br>

  <input id="password" type="password" placeholder="Password" />
  <br><br>

  <input id="confirmPassword" type="password" placeholder="Confirm Password" />
  <br><br>

  <button id="registerBtn">Register</button>

  <p id="msg"></p>

  <script type="module">
    import { auth, db } from "./js/firebase-config.js";

    import {
      createUserWithEmailAndPassword,
      sendEmailVerification
    } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-auth.js";

    import {
      doc,
      setDoc
    } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-firestore.js";

    const btn = document.getElementById("registerBtn");
    const msg = document.getElementById("msg");

    btn.addEventListener("click", async () => {

      const username = document.getElementById("username").value.trim();
      const email = document.getElementById("email").value.trim();
      const phone = document.getElementById("phone").value.trim();
      const password = document.getElementById("password").value;
      const confirmPassword = document.getElementById("confirmPassword").value;

      // Basic validation
      if (!username || !email || !phone || !password || !confirmPassword) {
        msg.innerText = "Please fill all fields.";
        return;
      }

      if (username.includes(" ")) {
        msg.innerText = "Username must not contain spaces.";
        return;
      }

      if (password.length < 6) {
        msg.innerText = "Password must be at least 6 characters.";
        return;
      }

      if (password !== confirmPassword) {
        msg.innerText = "Passwords do not match.";
        return;
      }

      try {

        // 1. Create user
        const userCredential = await createUserWithEmailAndPassword(auth, email, password);
        const user = userCredential.user;

        // 2. Send verification email
        await sendEmailVerification(user);

        // 3. Save user in Firestore
        await setDoc(doc(db, "users", user.uid), {
          username: username,
          email: email,
          phone: phone,
          emailVerified: false,
          createdAt: Date.now(),
          bestScore: 0
        });

        msg.innerText = "Account created. Check your email to verify.";

        // redirect
        setTimeout(() => {
          window.location.href = "login.html";
        }, 3000);

      } catch (error) {
        console.log(error.code, error.message);
        msg.innerText = error.code;
      }

    });

  </script>

</body>
</html>

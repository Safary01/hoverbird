<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HoverBird — Leaderboard</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet" />

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --sky-top:     #0a1628;
      --sky-mid:     #0d2a5c;
      --sky-low:     #1a4a8a;
      --gold:        #f5c842;
      --gold-dark:   #c9920a;
      --silver:      #c0c8d8;
      --bronze:      #cd7f32;
      --teal:        #00d4aa;
      --teal-dark:   #009977;
      --white:       #ffffff;
      --text-soft:   rgba(255,255,255,0.65);
      --text-muted:  rgba(255,255,255,0.35);
      --card-bg:     rgba(255,255,255,0.06);
      --card-border: rgba(255,255,255,0.12);
      --you-bg:      rgba(245,200,66,0.10);
      --you-border:  rgba(245,200,66,0.30);
    }

    html, body {
      min-height: 100%;
      font-family: 'Nunito', sans-serif;
      background: var(--sky-top);
      color: var(--white);
      overflow-x: hidden;
    }

    /* ── Background ─────────────────────────────────────────── */
    .sky {
      position: fixed; inset: 0;
      background: linear-gradient(180deg, var(--sky-top) 0%, var(--sky-mid) 55%, var(--sky-low) 100%);
      z-index: 0;
    }
    .stars { position: fixed; inset: 0; z-index: 1; pointer-events: none; }
    .star {
      position: absolute; background: #fff; border-radius: 50%;
      animation: twinkle var(--d,3s) ease-in-out infinite var(--delay,0s); opacity: 0;
    }
    @keyframes twinkle { 0%,100%{opacity:0} 50%{opacity:var(--op,0.8)} }

    .ground {
      position: fixed; bottom: 0; left: 0; right: 0; height: 70px;
      background: linear-gradient(180deg, #1a5c2a 0%, #0d3a18 100%);
      z-index: 3; border-top: 3px solid #2a8a3a;
    }
    .ground::before {
      content:''; position:absolute; top:-10px; left:0; right:0; height:10px;
      background: repeating-linear-gradient(90deg,#2a8a3a 0,#2a8a3a 30px,#1a5c2a 30px,#1a5c2a 60px);
    }

    /* ── Loading screen ─────────────────────────────────────── */
    #loading-screen {
      position: fixed; inset: 0; background: var(--sky-top);
      z-index: 999; display: flex; align-items: center;
      justify-content: center; flex-direction: column; gap: 1rem;
      transition: opacity 0.4s ease;
    }
    #loading-screen.hidden { opacity: 0; pointer-events: none; }
    .spinner {
      width: 40px; height: 40px;
      border: 3px solid rgba(245,200,66,0.2);
      border-top-color: var(--gold);
      border-radius: 50%; animation: spin 0.8s linear infinite;
    }
    .loading-text { color: var(--text-soft); font-size: 0.9rem; font-weight: 700; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Layout ─────────────────────────────────────────────── */
    .page {
      position: relative; z-index: 10;
      min-height: 100vh;
      display: flex; flex-direction: column;
      align-items: center;
      padding: 1.5rem 1.25rem 110px;
      gap: 1.25rem;
      max-width: 560px; margin: 0 auto;
    }

    /* ── Top bar ────────────────────────────────────────────── */
    .top-bar {
      width: 100%; display: flex;
      align-items: center; justify-content: space-between;
      padding-top: 0.5rem;
    }
    .back-link {
      display: flex; align-items: center; gap: 0.4rem;
      color: var(--text-soft); text-decoration: none;
      font-size: 0.85rem; font-weight: 700; transition: color 0.2s;
    }
    .back-link:hover { color: var(--white); }
    .back-link svg { width:18px; height:18px; stroke:currentColor; fill:none; stroke-width:2.5; stroke-linecap:round; stroke-linejoin:round; }

    .season-pill {
      background: rgba(0,212,170,0.12);
      border: 1px solid rgba(0,212,170,0.25);
      border-radius: 100px; padding: 0.3rem 0.9rem;
      font-size: 0.78rem; font-weight: 800; color: var(--teal);
      letter-spacing: 0.3px;
    }

    /* ── Page header ────────────────────────────────────────── */
    .page-header {
      width: 100%; text-align: center;
      display: flex; flex-direction: column; align-items: center; gap: 0.4rem;
    }
    .page-title {
      font-family: 'Fredoka One', cursive; font-size: 2.2rem;
      background: linear-gradient(135deg, var(--gold) 0%, #fff 60%, var(--teal) 100%);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
    }
    .page-sub { font-size: 0.85rem; color: var(--text-soft); font-weight: 700; }

    /* ── Your rank card ─────────────────────────────────────── */
    .your-rank-card {
      width: 100%;
      background: var(--you-bg);
      border: 1px solid var(--you-border);
      border-radius: 18px; padding: 1rem 1.2rem;
      display: flex; align-items: center; gap: 1rem;
      backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
      animation: fadeUp 0.5s cubic-bezier(0.22,1,0.36,1) both;
    }
    @keyframes fadeUp { from{opacity:0;transform:translateY(12px)} to{opacity:1;transform:translateY(0)} }

    .your-rank-icon { font-size: 1.8rem; flex-shrink: 0; }
    .your-rank-info { flex: 1; }
    .your-rank-label {
      font-size: 0.72rem; font-weight: 800; color: var(--gold);
      letter-spacing: 0.8px; text-transform: uppercase; margin-bottom: 0.1rem;
    }
    .your-rank-name {
      font-family: 'Fredoka One', cursive; font-size: 1.1rem; color: var(--white);
    }
    .your-rank-score {
      font-family: 'Fredoka One', cursive; font-size: 1.5rem; color: var(--gold);
      flex-shrink: 0;
    }

    /* ── Podium (top 3) ─────────────────────────────────────── */
    .podium {
      width: 100%;
      display: flex; align-items: flex-end; justify-content: center;
      gap: 0.75rem; padding: 0 0.5rem;
      animation: fadeUp 0.5s 0.05s cubic-bezier(0.22,1,0.36,1) both;
    }

    .podium-slot {
      flex: 1; display: flex; flex-direction: column;
      align-items: center; gap: 0.4rem;
    }
    .podium-slot.first  { order: 2; }
    .podium-slot.second { order: 1; }
    .podium-slot.third  { order: 3; }

    .podium-avatar {
      width: 52px; height: 52px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-family: 'Fredoka One', cursive; font-size: 1.3rem;
      border: 2.5px solid transparent; flex-shrink: 0;
      position: relative;
    }
    .podium-slot.first  .podium-avatar { width:66px; height:66px; font-size:1.6rem; background: rgba(245,200,66,0.2); border-color: var(--gold); }
    .podium-slot.second .podium-avatar { background: rgba(192,200,216,0.15); border-color: var(--silver); }
    .podium-slot.third  .podium-avatar { background: rgba(205,127,50,0.15);  border-color: var(--bronze); }

    .podium-crown {
      position: absolute; top: -14px; font-size: 1.1rem;
      display: none;
    }
    .podium-slot.first .podium-crown { display: block; }

    .podium-name {
      font-size: 0.8rem; font-weight: 800; color: var(--white);
      text-align: center; max-width: 90px;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .podium-score {
      font-family: 'Fredoka One', cursive; font-size: 1.1rem;
    }
    .podium-slot.first  .podium-score { font-size: 1.3rem; color: var(--gold); }
    .podium-slot.second .podium-score { color: var(--silver); }
    .podium-slot.third  .podium-score { color: var(--bronze); }

    .podium-block {
      width: 100%; border-radius: 12px 12px 0 0;
      display: flex; align-items: center; justify-content: center;
      padding: 0.5rem 0;
    }
    .podium-block-label {
      font-family: 'Fredoka One', cursive; font-size: 1.1rem;
    }
    .podium-slot.first  .podium-block { height: 70px; background: linear-gradient(180deg, rgba(245,200,66,0.25), rgba(245,200,66,0.08)); border: 1px solid rgba(245,200,66,0.25); }
    .podium-slot.second .podium-block { height: 52px; background: linear-gradient(180deg, rgba(192,200,216,0.15), rgba(192,200,216,0.05)); border: 1px solid rgba(192,200,216,0.2); }
    .podium-slot.third  .podium-block { height: 38px; background: linear-gradient(180deg, rgba(205,127,50,0.15),  rgba(205,127,50,0.05));  border: 1px solid rgba(205,127,50,0.2); }

    /* ── Leaderboard list ───────────────────────────────────── */
    .lb-list {
      width: 100%;
      display: flex; flex-direction: column; gap: 0.6rem;
      animation: fadeUp 0.5s 0.1s cubic-bezier(0.22,1,0.36,1) both;
    }

    .lb-section-title {
      font-size: 0.75rem; font-weight: 800; color: var(--text-muted);
      letter-spacing: 1px; text-transform: uppercase;
      padding: 0.2rem 0 0.1rem;
    }

    .lb-row {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 14px; padding: 0.85rem 1rem;
      display: flex; align-items: center; gap: 0.9rem;
      backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
      transition: background 0.2s, transform 0.15s;
      animation: fadeUp 0.4s both;
    }
    .lb-row:hover { background: rgba(255,255,255,0.09); transform: translateX(3px); }
    .lb-row.you {
      background: var(--you-bg);
      border-color: var(--you-border);
    }
    .lb-row.you:hover { background: rgba(245,200,66,0.14); }

    .lb-rank {
      width: 32px; text-align: center; flex-shrink: 0;
      font-family: 'Fredoka One', cursive; font-size: 1rem; color: var(--text-soft);
    }
    .lb-rank.top { font-size: 1.2rem; }

    .lb-avatar {
      width: 38px; height: 38px; border-radius: 50%; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      font-family: 'Fredoka One', cursive; font-size: 0.95rem;
      background: rgba(255,255,255,0.08); border: 1.5px solid rgba(255,255,255,0.12);
      color: var(--white);
    }
    .lb-row.you .lb-avatar { background: rgba(245,200,66,0.15); border-color: rgba(245,200,66,0.3); color: var(--gold); }

    .lb-info { flex: 1; min-width: 0; }
    .lb-name {
      font-weight: 800; font-size: 0.95rem; color: var(--white);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .lb-row.you .lb-name::after {
      content: ' (You)';
      font-size: 0.75rem; color: var(--gold); font-weight: 700;
    }
    .lb-sub { font-size: 0.72rem; color: var(--text-muted); font-weight: 700; margin-top: 0.1rem; }

    .lb-score {
      font-family: 'Fredoka One', cursive; font-size: 1.3rem;
      color: var(--white); flex-shrink: 0;
    }
    .lb-row.you .lb-score { color: var(--gold); }

    /* ── Empty / error state ────────────────────────────────── */
    .empty-state {
      width: 100%; text-align: center; padding: 2rem 1rem;
      color: var(--text-muted);
    }
    .empty-state .emoji { font-size: 3rem; margin-bottom: 0.6rem; display: block; }
    .empty-state p { font-size: 0.9rem; font-weight: 700; }

    /* ── Play CTA ───────────────────────────────────────────── */
    .play-cta {
      width: 100%; padding: 1rem;
      background: linear-gradient(135deg, var(--gold) 0%, #e6a800 100%);
      color: #1a0f00; font-family: 'Nunito', sans-serif;
      font-size: 1.05rem; font-weight: 800;
      border: none; border-radius: 16px; cursor: pointer;
      box-shadow: 0 4px 20px rgba(245,200,66,0.35);
      text-decoration: none; display: flex;
      align-items: center; justify-content: center; gap: 0.5rem;
      transition: filter 0.15s, box-shadow 0.15s, transform 0.15s;
    }
    .play-cta:hover { filter: brightness(1.08); box-shadow: 0 6px 28px rgba(245,200,66,0.5); transform: translateY(-2px); }
    .play-cta:active { transform: scale(0.97); }

    /* ── Footer nav ─────────────────────────────────────────── */
    .footer-nav {
      display: flex; gap: 1.5rem; flex-wrap: wrap; justify-content: center;
    }
    .footer-link {
      color: var(--text-muted); text-decoration: none;
      font-size: 0.78rem; font-weight: 700; transition: color 0.2s;
    }
    .footer-link:hover { color: var(--text-soft); }

    @media (max-width: 380px) {
      .podium-avatar { width: 44px !important; height: 44px !important; font-size: 1.1rem !important; }
      .podium-name { font-size: 0.72rem; }
    }
  </style>
</head>
<body>

  <div id="loading-screen">
    <div class="spinner"></div>
    <p class="loading-text">Loading leaderboard…</p>
  </div>

  <div class="sky"></div>
  <div class="stars" id="stars"></div>
  <div class="ground"></div>

  <main class="page" id="main-page" style="display:none;">

    <!-- Top bar -->
    <div class="top-bar">
      <a href="dashboard.html" class="back-link">
        <svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg>
        Dashboard
      </a>
      <div class="season-pill" id="season-pill">📅 Season</div>
    </div>

    <!-- Header -->
    <div class="page-header">
      <h1 class="page-title">📊 Leaderboard</h1>
      <p class="page-sub" id="page-sub">Top players this season</p>
    </div>

    <!-- Your rank card -->
    <div class="your-rank-card" id="your-rank-card" style="display:none;">
      <div class="your-rank-icon" id="yr-icon">🏅</div>
      <div class="your-rank-info">
        <p class="your-rank-label">Your Position</p>
        <p class="your-rank-name" id="yr-name">—</p>
      </div>
      <div class="your-rank-score" id="yr-score">0</div>
    </div>

    <!-- Podium (top 3) -->
    <div class="podium" id="podium" style="display:none;">
      <!-- 2nd -->
      <div class="podium-slot second" id="pod-2">
        <div class="podium-avatar" id="pod-2-av">?</div>
        <p class="podium-name" id="pod-2-name">—</p>
        <p class="podium-score" id="pod-2-score">0</p>
        <div class="podium-block"><span class="podium-block-label">🥈</span></div>
      </div>
      <!-- 1st -->
      <div class="podium-slot first" id="pod-1">
        <div class="podium-crown">👑</div>
        <div class="podium-avatar" id="pod-1-av">?</div>
        <p class="podium-name" id="pod-1-name">—</p>
        <p class="podium-score" id="pod-1-score">0</p>
        <div class="podium-block"><span class="podium-block-label">🥇</span></div>
      </div>
      <!-- 3rd -->
      <div class="podium-slot third" id="pod-3">
        <div class="podium-avatar" id="pod-3-av">?</div>
        <p class="podium-name" id="pod-3-name">—</p>
        <p class="podium-score" id="pod-3-score">0</p>
        <div class="podium-block"><span class="podium-block-label">🥉</span></div>
      </div>
    </div>

    <!-- Rest of leaderboard (#4+) -->
    <div class="lb-list" id="lb-list"></div>

    <!-- Empty state -->
    <div class="empty-state" id="empty-state" style="display:none;">
      <span class="emoji">🐦</span>
      <p>No scores yet this season.<br>Be the first to fly!</p>
    </div>

    <!-- Play CTA -->
    <a href="game.html" class="play-cta">
      🐦 Play & Climb the Board
    </a>

    <!-- Footer -->
    <nav class="footer-nav">
      <a href="hall-of-fame.html" class="footer-link">🏅 Hall of Fame</a>
      <a href="how-to-play.html"  class="footer-link">❓ How to Play</a>
      <a href="privacy-policy.html" class="footer-link">🔒 Privacy</a>
    </nav>

  </main>

  <!-- Firebase logic -->
  <script type="module">
    import { auth, db } from "./js/firebase-config.js";
    import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
    import {
      collection, query, orderBy, limit, getDocs
    } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

    const loadingScreen = document.getElementById("loading-screen");
    const mainPage      = document.getElementById("main-page");

    function hideLoading() {
      loadingScreen.classList.add("hidden");
      mainPage.style.display = "flex";
      setTimeout(() => loadingScreen.remove(), 400);
    }

    function initials(name) {
      return (name || "?").slice(0, 2).toUpperCase();
    }

    // Season label
    const now       = new Date();
    const monthName = now.toLocaleString("default", { month: "long" });
    const year      = now.getFullYear();
    document.getElementById("season-pill").textContent = `📅 ${monthName} ${year}`;
    document.getElementById("page-sub").textContent    = `Season standings — ${monthName} ${year}`;

    onAuthStateChanged(auth, async (user) => {
      if (!user) { window.location.replace("login.html"); return; }
      await loadLeaderboard(user.uid);
      hideLoading();
    });

    async function loadLeaderboard(myUid) {
      try {
        const q    = query(collection(db, "users"), orderBy("seasonScore", "desc"), limit(100));
        const snap = await getDocs(q);

        const players = [];
        snap.forEach(d => {
          const data = d.data();
          if ((data.seasonScore || 0) > 0 || d.id === myUid) {
            players.push({ uid: d.id, ...data });
          }
        });

        // Filter to only players with scores for display, but keep myUid
        const ranked = snap.docs.map(d => ({ uid: d.id, ...d.data() }));

        if (ranked.length === 0) {
          document.getElementById("empty-state").style.display = "block";
          return;
        }

        // ── Your rank card ────────────────────────────────
        const myIndex = ranked.findIndex(p => p.uid === myUid);
        if (myIndex >= 0) {
          const me    = ranked[myIndex];
          const rank  = myIndex + 1;
          const icons = ["🥇","🥈","🥉"];
          document.getElementById("yr-icon").textContent  = icons[myIndex] || `#${rank}`;
          document.getElementById("yr-name").textContent  = me.username || "You";
          document.getElementById("yr-score").textContent = (me.seasonScore || 0).toLocaleString();
          document.getElementById("your-rank-card").style.display = "flex";
        }

        // ── Podium (top 3) ────────────────────────────────
        const top3 = ranked.slice(0, 3);
        if (top3.length > 0) {
          document.getElementById("podium").style.display = "flex";

          const slots = [
            { idx: 0, av: "pod-1-av", name: "pod-1-name", score: "pod-1-score" },
            { idx: 1, av: "pod-2-av", name: "pod-2-name", score: "pod-2-score" },
            { idx: 2, av: "pod-3-av", name: "pod-3-name", score: "pod-3-score" },
          ];

          slots.forEach(slot => {
            const p = top3[slot.idx];
            if (!p) {
              document.getElementById(`pod-${slot.idx+1}`).style.display = "none";
              return;
            }
            document.getElementById(slot.av).textContent    = initials(p.username);
            document.getElementById(slot.name).textContent  = p.username || "Player";
            document.getElementById(slot.score).textContent = (p.seasonScore || 0).toLocaleString();

            // Highlight if it's you
            if (p.uid === myUid) {
              const avEl = document.getElementById(slot.av);
              avEl.style.background   = "rgba(245,200,66,0.25)";
              avEl.style.borderColor  = "var(--gold)";
              avEl.style.color        = "var(--gold)";
            }
          });
        }

        // ── Rows #4 and below ──────────────────────────────
        const rest   = ranked.slice(3);
        const lbList = document.getElementById("lb-list");

        if (rest.length > 0) {
          const title = document.createElement("p");
          title.className   = "lb-section-title";
          title.textContent = "Rankings";
          lbList.appendChild(title);
        }

        rest.forEach((p, i) => {
          const rank  = i + 4;
          const isYou = p.uid === myUid;
          const delay = 0.05 + i * 0.03;

          const row = document.createElement("div");
          row.className = `lb-row${isYou ? " you" : ""}`;
          row.style.animationDelay = `${delay}s`;

          row.innerHTML = `
            <div class="lb-rank">#${rank}</div>
            <div class="lb-avatar">${initials(p.username)}</div>
            <div class="lb-info">
              <p class="lb-name">${escHtml(p.username || "Player")}</p>
              <p class="lb-sub">Best: ${(p.bestScore || 0).toLocaleString()}</p>
            </div>
            <div class="lb-score">${(p.seasonScore || 0).toLocaleString()}</div>
          `;
          lbList.appendChild(row);
        });

        // If no ranked players at all
        if (ranked.filter(p => (p.seasonScore||0) > 0).length === 0) {
          document.getElementById("empty-state").style.display = "block";
        }

      } catch (err) {
        console.error("Leaderboard error:", err);
        document.getElementById("empty-state").style.display = "block";
        document.getElementById("empty-state").innerHTML = `
          <span class="emoji">⚠️</span>
          <p>Could not load leaderboard.<br>Check your connection and try again.</p>
        `;
      }
    }

    function escHtml(str) {
      return str.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
    }
  </script>

  <!-- Stars -->
  <script>
    const c = document.getElementById("stars");
    for (let i = 0; i < 70; i++) {
      const s = document.createElement("div");
      s.className = "star";
      const sz = Math.random()*2+0.5;
      s.style.cssText=`width:${sz}px;height:${sz}px;top:${Math.random()*70}%;left:${Math.random()*100}%;--d:${(Math.random()*3+2).toFixed(1)}s;--delay:-${(Math.random()*4).toFixed(1)}s;--op:${(Math.random()*0.5+0.4).toFixed(2)};`;
      c.appendChild(s);
    }
  </script>

</body>
</html>

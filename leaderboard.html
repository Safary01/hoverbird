<!DOCTYPE html>
<html>
<head>
  <title>HoverBird Leaderboard</title>
  <link rel="stylesheet" href="styles.css">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #87CEEB;
      text-align: center;
    }

    .top-bar {
      display: flex;
      justify-content: center;
      gap: 10px;
      padding: 15px 10px 5px;
      flex-wrap: wrap;
    }

    .top-btn {
      padding: 10px 16px;
      border: none;
      border-radius: 8px;
      background: blue;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
    }

    .top-btn:hover {
      opacity: 0.9;
    }

    h2 {
      margin: 10px 15px;
    }

    .info-text {
      max-width: 500px;
      margin: auto;
      padding: 0 15px 15px;
      font-size: 15px;
      line-height: 1.5;
    }

    .board {
      max-width: 500px;
      margin: auto;
      padding: 10px;
    }

    .player {
      background: white;
      margin: 8px 0;
      padding: 12px;
      border-radius: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 18px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }

    .rank {
      font-weight: bold;
      width: 50px;
    }

    .name {
      flex: 1;
      text-align: left;
      font-weight: bold;
    }

    .score {
      font-weight: bold;
    }
  </style>
</head>

<body>

<div class="top-bar">
  <button class="top-btn" onclick="goDashboard()">
    ← Dashboard
  </button>

  <button class="top-btn" onclick="goHallOfFame()">
    🏆 Hall of Fame
  </button>
</div>

<h2>🏆 HoverBird Leaderboard</h2>

<div class="info-text">
  Top 3 players at the end of each month qualify for rewards.
</div>

<div class="board" id="board">
  Loading...
</div>

<script type="module">

import { db } from "./js/firebase-config.js";

import {
  collection,
  getDocs
} from "https://www.gstatic.com/firebasejs/12.14.0/firebase-firestore.js";

const board = document.getElementById("board");

// ---------------- SEASON ----------------

function getCurrentSeason() {

  const now = new Date();

  const year = now.getFullYear();

  const month =
    String(now.getMonth() + 1).padStart(2, "0");

  return `${year}-${month}`;
}

// ---------------- LOAD LEADERBOARD ----------------

async function loadLeaderboard() {

  const currentSeason =
    getCurrentSeason();

  const snapshot =
    await getDocs(collection(db, "users"));

  let users = [];

  snapshot.forEach(doc => {

    const data = doc.data();

    if (data.season === currentSeason) {

      users.push({
        name: data.username || "Player",
        score: data.seasonScore || 0
      });

    }

  });

  users.sort((a, b) => b.score - a.score);

  board.innerHTML = "";

  if (users.length === 0) {

    board.innerHTML =
      "<p>No players this season yet.</p>";

    return;
  }

  users.forEach((user, index) => {

    const div = document.createElement("div");
    div.className = "player";

    let rankDisplay = `#${index + 1}`;

    if (index === 0) {
      rankDisplay = "🥇";
    } else if (index === 1) {
      rankDisplay = "🥈";
    } else if (index === 2) {
      rankDisplay = "🥉";
    }

    div.innerHTML = `
      <div class="rank">${rankDisplay}</div>
      <div class="name">${user.name}</div>
      <div class="score">${user.score}</div>
    `;

    board.appendChild(div);

  });

}

loadLeaderboard();

// ---------------- NAVIGATION ----------------

window.goDashboard = function () {
  window.location.href = "dashboard.html";
};

window.goHallOfFame = function () {
  window.location.href = "hall-of-fame.html";
};

</script>

</body>
</html>
